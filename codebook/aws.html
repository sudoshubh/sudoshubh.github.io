<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AWS Interview Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --paper2:#FAFBFC; --sunk:#E2E7EC;
  --ink:#141B2D; --ink2:#4A5568; --ink3:#7A8698;
  --rule:#CBD4DD; --rule2:#DDE3E9;
  --red:#B3382C; --redbg:#F7E7E4;
  --green:#186B54; --greenbg:#E2EFEA;
  --blue:#25508C; --bluebg:#E4EAF4;
  --mark:#FFE27A;
  --shadow:0 1px 0 var(--rule);
  --rail:270px; --marg:236px; --topH:53px;
}
html[data-night="1"]{
  --paper:#131A24; --paper2:#1A222E; --sunk:#0E141C;
  --ink:#E7EDF4; --ink2:#A9B6C6; --ink3:#7C8B9E;
  --rule:#2B3746; --rule2:#222C39;
  --red:#EA8478; --redbg:#2C1F20;
  --green:#5CC9A5; --greenbg:#152A26;
  --blue:#89AEE8; --bluebg:#18222F;
  --mark:#B99219;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
code,kbd,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--blue)}
a[data-go]{cursor:pointer;text-decoration:underline}
.card[data-go]{text-decoration:none}
.btn[data-go]{text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--rule); display:flex; align-items:center;
  gap:18px; padding:10px 20px; flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-weight:700;letter-spacing:-.02em;font-size:17px}
.brand span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3)}
.modes{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.modes button{background:transparent;border:0;padding:6px 13px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--rule)}
.modes button:last-child{border-right:0}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative}
.search input{
  font:inherit;font-size:13.5px;padding:6px 10px 6px 28px;width:210px;
  background:var(--paper2); color:var(--ink);
  border:1px solid var(--rule); border-radius:3px;
}
.search svg{position:absolute;left:8px;top:8px;opacity:.5}
.icnbtn{background:transparent;border:1px solid var(--rule);border-radius:3px;cursor:pointer;padding:5px 9px;font-size:13px}
.menu-btn{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);align-items:start}
.rail{
  position:sticky; top:var(--topH); height:calc(100vh - var(--topH)); overflow-y:auto;
  border-right:1px solid var(--rule); padding:20px 14px 60px;
  scrollbar-width:thin;
}
.rail h4{
  font-size:11.5px;font-family:"IBM Plex Mono",monospace;color:var(--ink3);
  margin:20px 0 6px;font-weight:500;letter-spacing:.03em;
}
.rail h4:first-child{margin-top:0}
.rail a{
  display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink2);
  font-size:13.5px;padding:3px 7px;border-radius:3px;line-height:1.35;
}
.rail a:hover{background:var(--sunk);color:var(--ink)}
.rail a.on{background:var(--ink);color:var(--paper)}
.rail a.on .dot{border-color:var(--paper)}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
.dot[data-r="solid"]{background:var(--green);border-color:var(--green)}
.dot[data-r="shaky"]{background:var(--mark);border-color:var(--mark)}
.dot[data-r="new"]{background:transparent}

.page{padding:34px 30px 120px;max-width:1220px}
.cols{display:grid;grid-template-columns:minmax(0,70ch) var(--marg);gap:38px;align-items:start}
@media(max-width:1180px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:var(--topH);width:280px;background:var(--paper);z-index:35;transform:translateX(-102%);transition:transform .18s;box-shadow:2px 0 14px rgba(0,0,0,.13)}
  .rail.open{transform:none}
  .menu-btn{display:block}
  .page{padding:24px 18px 100px}
  .search input{width:130px}
}

/* ---------- typography ---------- */
h1{font-size:31px;line-height:1.15;letter-spacing:-.025em;margin:0 0 6px;font-weight:700}
h2{font-size:20px;letter-spacing:-.015em;margin:38px 0 10px;font-weight:600;padding-bottom:5px;border-bottom:1px solid var(--rule)}
h3{font-size:15.5px;margin:24px 0 6px;font-weight:600}
p{margin:0 0 13px}
ul,ol{margin:0 0 14px;padding-left:20px}
li{margin-bottom:5px}
.lede{font-size:17.5px;color:var(--ink2);line-height:1.5;margin-bottom:22px}
.kicker{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3)}
.mark{background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 94%, transparent 94%);padding:0 1px}
.tag{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;
  border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--ink2);background:var(--paper2)
}

/* ---------- blocks ---------- */
.hook{
  border-left:3px solid var(--mark); background:var(--paper2);
  padding:12px 15px; margin:16px 0 22px; font-size:15.5px;
}
.hook b{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);font-weight:500;margin-bottom:3px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule);margin:14px 0 20px}
@media(max-width:640px){.pick{grid-template-columns:1fr}}
.pick > div{padding:12px 15px}
.pick > div:first-child{border-right:1px solid var(--rule);background:var(--greenbg)}
.pick > div:last-child{background:var(--redbg)}
@media(max-width:640px){.pick > div:first-child{border-right:0;border-bottom:1px solid var(--rule)}}
.pick h5{margin:0 0 7px;font-size:12px;font-family:"IBM Plex Mono",monospace;font-weight:500}
.pick div:first-child h5{color:var(--green)}
.pick div:last-child h5{color:var(--red)}
.pick ul{margin:0;padding-left:17px;font-size:14px}

.nums{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:14px}
.nums td{border-bottom:1px solid var(--rule2);padding:6px 8px;vertical-align:top}
.nums td:first-child{color:var(--ink2);width:56%}
.nums td:last-child{font-family:"IBM Plex Mono",monospace;font-weight:500}

.gotcha{border-top:1px solid var(--rule);padding-top:4px;margin:18px 0}
.gotcha li{padding-left:2px}
.gotcha ul{list-style:none;padding-left:0}
.gotcha li::before{content:"×";color:var(--red);font-weight:600;margin-right:9px;font-family:"IBM Plex Mono",monospace}
.gotcha li{display:flex;gap:0;font-size:14.5px}

/* Q&A */
.qa{border-top:1px solid var(--rule);margin-top:6px}
.q{border-bottom:1px solid var(--rule2)}
.q > button{
  width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;
  background:none;border:0;padding:11px 2px;cursor:pointer;font-size:15px;line-height:1.45
}
.q > button:hover{color:var(--blue)}
.qn{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);padding-top:3px;flex:none;min-width:26px}
.qlvl{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 5px;border-radius:2px;flex:none;margin-top:3px}
.qlvl.screen{background:var(--bluebg);color:var(--blue)}
.qlvl.core{background:var(--greenbg);color:var(--green)}
.qlvl.senior{background:var(--redbg);color:var(--red)}
.ans{display:none;padding:0 2px 15px 37px;font-size:14.6px;color:var(--ink2);line-height:1.62}
.ans.open{display:block}
.ans strong{color:var(--ink)}
.ans p{margin:0 0 9px}
.ans ul{padding-left:18px;margin:0 0 9px}

/* margin notes */
.marg{font-size:13.5px;color:var(--ink2);line-height:1.5}
.note{border-top:2px solid var(--blue);padding-top:9px;margin-bottom:24px}
.note b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--blue);font-weight:500;margin-bottom:4px}
@media(max-width:1180px){
  .marg{margin-top:26px;border-left:2px solid var(--rule);padding-left:16px}
  .note{border-top:0;padding-top:0}
}

/* recall control */
.recall{display:flex;gap:7px;align-items:center;margin:26px 0 0;padding-top:16px;border-top:1px solid var(--rule);flex-wrap:wrap}
.recall span{font-size:13px;color:var(--ink3);margin-right:3px}
.recall button{background:var(--paper2);border:1px solid var(--rule);border-radius:3px;padding:4px 11px;font-size:13px;cursor:pointer}
.recall button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* cards / grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px;margin:14px 0 24px}
.card{border:1px solid var(--rule);background:var(--paper2);padding:12px 14px;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:var(--ink)}
.card b{display:block;font-size:14.5px;margin-bottom:3px}
.card em{font-style:normal;font-size:13px;color:var(--ink2);line-height:1.42;display:block}

/* duel table */
.duel{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0 26px}
.duel th{text-align:left;padding:8px;border-bottom:2px solid var(--ink);font-size:13.5px;vertical-align:bottom}
.duel td{padding:8px;border-bottom:1px solid var(--rule2);vertical-align:top}
.duel td:first-child,.duel th:first-child{color:var(--ink2);width:150px}
.duel tr:last-child td{background:var(--greenbg);font-weight:500}
.scroller{overflow-x:auto}

/* hero / cold open */
.cold{border:1px solid var(--ink);background:var(--paper2);padding:0;margin:22px 0 30px}
.cold-h{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3)}
.cold-b{padding:22px 20px}
.cold-q{font-size:21px;line-height:1.35;letter-spacing:-.015em;margin:0 0 4px;font-weight:600}
.cold-a{font-size:14.8px;color:var(--ink2);line-height:1.62;margin-top:14px;padding-top:14px;border-top:1px dashed var(--rule);display:none}
.cold-a.open{display:block}
.cold-f{display:flex;gap:9px;padding:0 20px 18px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:3px;padding:6px 15px;font-size:13.5px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}

/* flashcards */
.fc-wrap{max-width:640px;margin:0 auto}
.fc{
  border:1px solid var(--ink);background:var(--paper2);min-height:290px;
  display:flex;flex-direction:column;justify-content:center;padding:32px 28px;cursor:pointer;
}
.fc .front{font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.015em}
.fc .back{margin-top:18px;padding-top:16px;border-top:1px dashed var(--rule);font-size:15px;color:var(--ink2);line-height:1.6}
.fc-meta{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.fc-bar{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.hint{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:14px}
kbd{border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:11.5px;background:var(--paper2)}

/* quiz */
.quiz{max-width:660px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper2);padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:14.6px;line-height:1.45;border-radius:3px}
.opt:hover{border-color:var(--ink)}
.opt.right{background:var(--greenbg);border-color:var(--green)}
.opt.wrong{background:var(--redbg);border-color:var(--red)}
.opt.dim{opacity:.55}
.why{background:var(--paper2);border-left:3px solid var(--blue);padding:12px 15px;font-size:14.4px;margin:12px 0 18px;color:var(--ink2)}
.bar{height:3px;background:var(--sunk);margin-bottom:20px}
.bar i{display:block;height:3px;background:var(--ink)}

/* misc */
.plan{border-collapse:collapse;width:100%;font-size:14.2px;margin:14px 0 24px}
.plan th{text-align:left;padding:7px 8px;border-bottom:2px solid var(--ink);font-size:13px}
.plan td{padding:7px 8px;border-bottom:1px solid var(--rule2);vertical-align:top}
.stack{border-left:2px solid var(--rule);padding-left:16px;margin:14px 0 22px}
.stack > div{margin-bottom:14px}
.stack b{font-size:14.5px}
.stack p{margin:2px 0 0;font-size:14.3px;color:var(--ink2)}
.empty{color:var(--ink3);font-size:14.5px;padding:20px 0}
.crumb{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.crumb a{color:var(--ink3);text-decoration:none}
.crumb a:hover{color:var(--blue)}
hr.soft{border:0;border-top:1px solid var(--rule);margin:30px 0}

@media print{
  .top,.rail,.recall,.cold-f,.menu-btn{display:none!important}
  .shell{display:block}
  .ans{display:block!important}
  .cols{grid-template-columns:1fr}
  body{background:#fff;font-size:11pt}
  h2{break-after:avoid}
  .q{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <button class="icnbtn menu-btn" id="menuBtn" aria-label="Open contents">☰</button>
  <button class="brand" data-go="/">
    <b>The AWS Interview Book</b><span>senior + lead edition</span>
  </button>
  <div class="search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Search services, terms" autocomplete="off">
  </div>
  <div class="modes" role="group" aria-label="Mode">
    <button data-mode="book" aria-pressed="true">Book</button>
    <button data-mode="cards" aria-pressed="false">Cards</button>
    <button data-mode="quiz" aria-pressed="false">Quiz</button>
  </div>
  <button class="icnbtn" id="night" aria-label="Toggle night reading">◐</button>
</header>
<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main class="page" id="page"></main>
</div>
<script>
const SERVICES = [
{
id:"lambda", name:"AWS Lambda", domain:"Compute", tier:1,
tagline:"Run a function per event. You give up the machine and buy back operations.",
hook:"Lambda is a <b>reaction</b>, not a server. If the work has no natural trigger, or it cannot finish in 15 minutes, it is the wrong shape.",
model:"Lambda takes an event, spins a micro-VM (Firecracker) with your code, runs one invocation per execution environment at a time, and freezes it. Scaling is just more environments. Everything painful about Lambda comes from three facts: environments are cold on first use, they are frozen between invocations, and concurrency is a shared account-level budget.",
facts:[
"Concurrency = arrival rate × average duration (Little's Law). 100 req/s at 200 ms = 20 concurrent executions. Interviewers love this arithmetic.",
"Three concurrency dials: <strong>unreserved</strong> (shared pool), <strong>reserved</strong> (a guaranteed floor and a hard ceiling for one function), <strong>provisioned</strong> (pre-warmed environments, no cold start, billed hourly).",
"CPU is not a setting. It scales linearly with memory — around 1 vCPU near 1.8 GB. Raising memory often makes a CPU-bound function <em>cheaper</em> because duration falls faster than price rises.",
"Event source mappings (SQS, Kinesis, DynamoDB Streams, MSK) are pull-based: Lambda polls for you and handles batching, retries and partial batch failures.",
"Background work after you return the response does not run — the environment is frozen. Anything asynchronous must complete before the handler returns."
],
numbers:[["Max execution time","15 minutes"],["Memory","128 MB – 10,240 MB"],["Ephemeral /tmp","512 MB – 10 GB"],["Sync payload in/out","6 MB"],["Async event payload","256 KB"],["Zip package (unzipped)","250 MB"],["Container image","10 GB"],["Default concurrency/region","1,000 (soft limit)"],["Response streaming","up to 20 MB"]],
pick:{use:["Event-driven glue: S3 upload, stream record, webhook, cron","Spiky or unpredictable traffic where idle cost matters","Small ops automation and control-plane tasks","Fan-out consumers that scale to zero overnight"],avoid:["Steady high-throughput traffic — containers are cheaper past a crossover","Anything over 15 minutes, or needing a warm local cache","Latency floors under ~10 ms p99 with a cold-start tail","Heavy shared dependencies, big JVM heaps, or long connection pooling"]},
gotchas:[
"An SQS event source mapping with a batch of 10 fails the <em>whole batch</em> back to the queue unless you return <code>batchItemFailures</code>. One poison message replays nine good ones.",
"Visibility timeout on the source queue must be at least six times the function timeout, or messages get redelivered mid-processing.",
"RDS connection pools do not work well: 500 concurrent Lambdas open 500 connections. Use RDS Proxy or move to DynamoDB.",
"Retries are silent. Async invocations retry twice with backoff, then go to a destination or DLQ if you configured one — otherwise the event is gone.",
"Recursion via S3: a function triggered by a bucket that writes back to the same bucket is the classic runaway bill."
],
qs:[
{lvl:"screen",q:"When would you not use Lambda?",a:"<p>I frame it as three exclusion tests. <strong>Duration</strong> — anything over 15 minutes is out; that pushes me to Fargate, Batch or Step Functions with a container task. <strong>Steady load</strong> — Lambda bills per millisecond with no idle discount, so above roughly 40–50% sustained utilisation a Fargate service usually wins on cost. <strong>Latency contract</strong> — if I owe a hard p99 and cannot tolerate cold starts, I would need provisioned concurrency, and once I am paying to keep it warm I have reinvented a server with worse ergonomics.</p><p>The fourth, quieter reason is state: connection pools, warmed caches and long-lived clients all fight the freeze-thaw model.</p>"},
{lvl:"core",q:"Your function reads from SQS. Duplicate processing is showing up downstream. Walk me through it.",a:"<p>Three candidate causes, checked in order.</p><ul><li><strong>Visibility timeout too short.</strong> If the function runs 40 s and the queue visibility is 30 s, SQS hands the same message to a second invocation while the first is still working. Rule of thumb: visibility ≥ 6× function timeout.</li><li><strong>Batch failure semantics.</strong> Without <code>ReportBatchItemFailures</code>, one failed record returns the entire batch; the nine successful ones are reprocessed.</li><li><strong>Standard queue at-least-once delivery.</strong> Even with everything correct, SQS standard can deliver twice. FIFO reduces it but does not remove the need for idempotency.</li></ul><p>The real fix is at the sink, not the queue: an idempotency key stored with a DynamoDB conditional write on <code>attribute_not_exists(pk)</code>, so a repeat is a no-op rather than a second side effect.</p>"},
{lvl:"core",q:"How do you cut cold starts for a Java function?",a:"<p>Order of leverage. <strong>SnapStart</strong> first — it snapshots the initialised JVM after <code>init</code> and restores from that, which typically removes most of the JVM and framework startup cost. Then <strong>trim the dependency graph</strong>; a fat Spring context is the actual cost, not the runtime. Move client construction into the init phase so it is captured in the snapshot and reused. Prefer plain SDK clients over reflection-heavy frameworks in the hot path.</p><p>After that, <strong>provisioned concurrency</strong> on the functions with a latency SLA, sized to your p50 concurrency, letting the rest burst on-demand. And with SnapStart, watch for state that must not be snapshotted — random seeds, cached credentials, unique IDs generated at init.</p>"},
{lvl:"senior",q:"Design the concurrency controls for a payments API where a bulk report job keeps starving live traffic.",a:"<p>The failure is that both functions draw from one unreserved pool, so the report job's burst consumes the account budget and the payment path gets throttled with 429s.</p><p>I would set <strong>reserved concurrency</strong> on both. Reserved does double duty: it carves out a guaranteed floor for the payment function and simultaneously caps the report function so it can never exceed, say, 50. Size the payment reservation from measured peak concurrency plus headroom, and add <strong>provisioned concurrency</strong> underneath it for the cold-start tail.</p><p>Then make the report path asynchronous — SQS in front, so throttles become queue depth rather than dropped work — and alarm on <code>ConcurrentExecutions</code> against the account limit plus <code>Throttles</code> on the payment function. Requesting a raised account limit is the last step, not the first: it hides the isolation problem.</p>"},
{lvl:"senior",q:"When does Lambda stop being cheap?",a:"<p>Do the arithmetic out loud, because that is what is actually being tested. Lambda bills GB-seconds plus per-request; a container bills wall-clock regardless of use. So the crossover is a utilisation number, not a traffic number.</p><p>A function at 512 MB and 100 ms serving 200 req/s runs about 10 GB-s per second continuously — that is a machine's worth of compute, paid at serverless rates, with no reserved-instance or Savings Plan discount and no Spot. Around sustained double-digit utilisation the Fargate or EC2 equivalent typically wins, and the gap widens with Graviton and Spot.</p><p>The counter-argument I always add: the compute line is not the whole bill. If moving off Lambda means someone now owns patching, autoscaling policies and on-call, that is real cost too. I would migrate the top two or three functions by spend and leave the long tail serverless.</p>"}
]},

{
id:"ecs", name:"Amazon ECS", domain:"Compute", tier:1,
tagline:"AWS-native container orchestration. Fewer knobs than Kubernetes, and fewer things to run.",
hook:"ECS is the orchestrator you choose when you want <b>containers</b>, not when you want <b>Kubernetes</b>. The API surface is small enough to hold in your head.",
model:"Three nouns. A <strong>task definition</strong> is an immutable blueprint (image, CPU, memory, IAM role, log config). A <strong>task</strong> is one running instance of it. A <strong>service</strong> keeps N tasks alive, registers them with a load balancer and rolls out new versions. Underneath sits either EC2 instances you own or Fargate, where AWS owns them.",
facts:[
"<strong>awsvpc</strong> network mode gives every task its own ENI and private IP, so security groups apply per task — the same isolation model you would build with a service mesh, for free.",
"Two IAM roles per task and people mix them up constantly: the <strong>execution role</strong> lets the agent pull the image and write logs; the <strong>task role</strong> is what your application code assumes.",

qs:[
{lvl:"screen",q:"ECS or EKS?",a:"<p>My default is: <strong>ECS unless something specifically needs Kubernetes.</strong> ECS has no control-plane cost, a far smaller API surface, and no upgrade treadmill — which for a team of six matters more than any feature.</p><p>I move to EKS when the requirement names the ecosystem: Helm charts we already depend on, operators, Argo CD, KEDA, Istio, or portability to on-prem. Those are real reasons. 'It is the industry standard' is not one I would accept without asking who operates it at 2 a.m.</p>"},
{lvl:"core",q:"Explain the two IAM roles on a task and why the split exists.",a:"<p>The <strong>task execution role</strong> belongs to the ECS agent, not your code. It pulls the image from ECR, fetches secrets injected into the task definition, and writes to CloudWatch Logs. The <strong>task role</strong> is assumed by the container process itself and is what your SDK picks up from the container credentials endpoint.</p><p>The split exists so the agent's ability to pull images does not become your application's ability to read S3. It is privilege separation across a trust boundary — the same reason a Kubernetes node role is not the pod role.</p><p>The usual bug: someone puts <code>s3:GetObject</code> on the execution role, it does not work, and they widen both.</p>"},
{lvl:"core",q:"How does an ECS service scale, end to end?",a:"<p>Two independent layers, and conflating them is the common mistake.</p><ul><li><strong>Service auto scaling</strong> changes the desired task count — target tracking on CPU, memory, or best of all <code>ALBRequestCountPerTarget</code>, which tracks the thing users actually feel.</li><li><strong>Cluster capacity</strong> supplies somewhere to place them. On Fargate that is automatic. On EC2 a capacity provider with managed scaling drives the ASG off <code>CapacityProviderReservation</code>.</li></ul><p>If you only wire the first layer on EC2, tasks sit in PENDING with no room. I would also set the scale-in cooldown longer than scale-out, so a traffic dip does not cause flapping.</p>"},
{lvl:"senior",q:"Your rolling deploy briefly returns 502s. Diagnose it.",a:"<p>502 from an ALB means the target accepted the connection then failed to complete a valid response — so the target group is routing to a task that is not ready, or one that is going away.</p><p>On the way in: the health check passes before the app can actually serve, so I would use a real readiness endpoint and set <code>healthCheckGracePeriodSeconds</code> above cold-start time. On the way out: the ALB is still sending requests to a draining task. That needs <strong>deregistration delay</strong> longer than the longest in-flight request, and the container must trap <code>SIGTERM</code>, stop accepting new work, drain, then exit — with <code>stopTimeout</code> long enough to let it.</p><p>Also worth checking: keep-alive mismatch. If the app's idle timeout is shorter than the ALB's, the ALB reuses a connection the app just closed and you get sporadic 502s that look like a deploy issue but are not.</p>"}
]},

tagline:"Managed Kubernetes control plane. You still own the rest of Kubernetes.",
hook:"EKS manages the <b>control plane</b>. Everything you actually get paged for — CNI, autoscaler, ingress, add-on versions — is still yours.",
model:"AWS runs the API server and etcd across AZs and charges hourly. You bring nodes (managed node groups, self-managed, Karpenter, or Fargate profiles) and the add-ons that make the cluster usable: VPC CNI, CoreDNS, kube-proxy, EBS CSI driver, the load balancer controller. The interesting AWS-specific parts are networking and identity.",

"<strong>VPC CNI gives pods real VPC IPs.</strong> Great for security groups and no overlay, but pod density per node is bounded by ENIs × IPs-per-ENI, and large clusters exhaust subnet CIDRs.",

numbers:[["Control plane","hourly per cluster, always on"],["Pods per node","bounded by ENIs × IPs per ENI"],["Node group types","managed, self-managed, Fargate"],["Identity","Pod Identity (current), IRSA (legacy)"],["Version support","limited window, then forced upgrade"]],
pick:{use:["You depend on the K8s ecosystem: Helm, operators, Argo, KEDA, Istio","Portability across clouds or to on-prem is a real requirement","Complex scheduling — GPU sharing, topology spread, gang scheduling","Platform team exists and wants a standard substrate"],avoid:["Small team with a handful of stateless services — ECS is less to run","Cost-sensitive and low-scale: the control plane fee is fixed overhead","Nobody on the team can debug CNI or a failed upgrade","Batch-shaped work that Batch or EMR Serverless handles natively"]},
gotchas:[
"Subnet IP exhaustion. Pods get VPC IPs, so a /24 per subnet dies fast. Plan CIDRs up front or add secondary CIDR ranges with custom networking.",
"Node group upgrades silently evict pods with no PodDisruptionBudget. No PDB means no protection.",
"IRSA breaks quietly when the OIDC provider is missing or the trust policy's <code>sub</code> condition does not match namespace and service account exactly.",
"A pod stuck Pending is usually resource requests, not cluster capacity — an unschedulable request is invisible until you read the events.",
"The AWS Load Balancer Controller creates real ALBs. One Ingress per service, unattended, becomes a surprising monthly line item."
],
qs:[
{lvl:"screen",q:"What does EKS actually manage for you?",a:"<p>The control plane only: API server, etcd, scheduler and controller manager, run across at least two AZs with automatic patching and backups. That eliminates a genuinely hard operational job — nobody wants to restore etcd at 3 a.m.</p><p>What it does not manage: worker nodes and their AMIs, the CNI configuration, add-on versions, autoscaling, ingress, upgrade sequencing, and the whole in-cluster ecosystem. Roughly, AWS takes the part that is hard to build and leaves the part that is hard to operate.</p>"},
{lvl:"core",q:"How does a pod get permission to read an S3 bucket?",a:"<p>Not with node roles — that grants the permission to every pod on the node, which is the anti-pattern.</p><p>The current mechanism is <strong>EKS Pod Identity</strong>: install the agent add-on, then create an association between a Kubernetes service account and an IAM role. Pods using that service account get scoped credentials from the agent. It avoids per-cluster OIDC setup and makes the role reusable across clusters.</p><p>The older and still very common mechanism is <strong>IRSA</strong>: the cluster gets an OIDC identity provider, the service account is annotated with a role ARN, and the role trusts that OIDC issuer with a condition on <code>sub</code> matching <code>system:serviceaccount:&lt;ns&gt;:&lt;name&gt;</code>. The pod gets a projected token and calls <code>AssumeRoleWithWebIdentity</code>.</p><p>Either way the point is the same: identity per workload, not per node.</p>"},
{lvl:"senior",q:"Your EKS bill doubled. Where do you look?",a:"<p>I would attack it in descending order of typical size.</p><ul><li><strong>Node utilisation.</strong> Pull requests versus actual usage. Over-requested pods pin nodes at 30% real utilisation while looking full to the scheduler. Karpenter with consolidation, plus right-sized requests, is normally the single biggest win.</li><li><strong>Instance economics.</strong> Graviton for anything that compiles for ARM, Spot for stateless and batch with a diversified pool, Savings Plans for the steady floor.</li><li><strong>Load balancers.</strong> One ALB per Ingress adds up; consolidate with a shared ingress and host or path rules.</li><li><strong>Data transfer.</strong> Cross-AZ chatter between services is billed both ways. Topology-aware routing keeps traffic in-zone.</li><li><strong>Observability.</strong> CloudWatch Logs ingestion from chatty debug logging is very often larger than people expect.</li></ul><p>I would confirm with cost allocation tags or Kubecost per namespace before changing anything, so the fix is aimed at the actual driver.</p>"},
{lvl:"senior",q:"Give me your EKS upgrade runbook.",a:"<p>Read the deprecation notes first and grep manifests for removed APIs — that is what actually breaks clusters. Then: staging cluster first, at the same version, with the same add-ons.</p><p>Sequence is control plane, then add-ons (VPC CNI, CoreDNS, kube-proxy — they have version skew rules), then nodes. Nodes go via a new managed node group at the new version, cordon and drain the old one gradually, with PodDisruptionBudgets in place so drains cannot take a service below quorum. Keep the old group until the new one has soaked.</p><p>Two things I insist on: never skip minor versions, and make sure every workload has a PDB and sane termination handling before the first drain, or the upgrade itself becomes the outage.</p>"}
]},

qs:[
{lvl:"screen",q:"Fargate or EC2 launch type?",a:"<p>EC2 wins on unit cost at steady utilisation and is the only option for GPUs, daemonsets, host access or very large instances. Fargate wins whenever the load is uneven or the team is small, because you stop owning AMIs, patching and cluster scaling.</p><p>In practice I mix them: a capacity provider strategy that puts the steady baseline on reserved EC2 and lets the burst spill onto Fargate or Fargate Spot.</p>"},
{lvl:"core",q:"How do you handle Fargate Spot interruptions?",a:"<p>Treat it exactly like Spot on EC2. You get a two-minute warning as a task state change, so the container must trap <code>SIGTERM</code>, stop pulling new work, finish or requeue what it holds, and exit cleanly.</p><p>Architecturally: only stateless or requeue-safe work goes on Spot, the queue keeps the record of truth so an interrupted message reappears after visibility timeout, and the capacity provider strategy keeps a guaranteed base on on-demand with a weighted overflow to Spot. Never put the last replica of anything on Spot.</p>"}
]},

qs:[
{lvl:"core",q:"Batch versus Lambda versus EMR — how do you choose?",a:"<p>I split on the shape of the work, not the size.</p><ul><li><strong>Lambda</strong>: short, event-triggered, per-record, under 15 minutes.</li><li><strong>Batch</strong>: coarse-grained independent jobs, minutes to hours, each one a container. No inter-job communication.</li><li><strong>EMR / Glue</strong>: one logical dataset processed with shuffles, joins and aggregations across a cluster — Spark's distributed execution is the point.</li></ul><p>The test I use: if the jobs need to talk to each other or exchange data mid-flight, it is Spark. If they are genuinely independent and you would otherwise write a for-loop over files, it is Batch. If each unit is small and fires on an event, it is Lambda.</p>"},
{lvl:"core",q:"How do you run this on Spot without losing work?",a:"<p>Use a managed compute environment with a <em>diverse</em> instance type list and capacity-optimised allocation, so Batch picks the deepest pools and interruptions are rarer.</p><p>Then make jobs restart-safe: idempotent by design, checkpointing long jobs to S3 so a retry resumes rather than restarts, and writing output to a temp prefix promoted only on success so a killed job cannot leave half a file that downstream readers pick up.</p><p>Configure retries with <code>evaluateOnExit</code> so Spot reclaims retry but genuine application failures do not burn attempts. And keep a small on-demand queue for the tail — the last few jobs of a deadline-bound run should not be waiting on Spot capacity.</p>"},
{lvl:"senior",q:"Design a nightly pipeline that processes 200,000 telemetry files, must finish in four hours, and should be cheap.",a:"<p>Shape first: 200k independent files is an <strong>array job</strong>, not 200k separate submissions. I would have EventBridge Scheduler kick off a small Lambda that lists the manifest and submits one array job of a few thousand children, each child handling a shard of files so per-job overhead does not dominate.</p><p>Compute: managed Spot environment, diversified instance types, capacity-optimised. Sizing comes from the arithmetic — measure per-file time, multiply, divide by the four-hour window, and that gives the vCPU ceiling to set on the environment. Set the ceiling explicitly so a bad night cannot spin up unbounded capacity.</p><p>Correctness: idempotent writes keyed on file ID, temp-prefix-then-move, DLQ-equivalent via a failed-job queue that a second array job retries on on-demand capacity.</p><p>Observability: the metric that matters is queue depth burn-down against the deadline, alarmed at the halfway mark — that gives you two hours to react rather than discovering failure at 6 a.m.</p>"}
]},

qs:[
{lvl:"screen",q:"Spot, Reserved or On-Demand — how do you split a fleet?",a:"<p>I layer it. The measured floor of steady demand goes on <strong>Savings Plans</strong> — Compute Savings Plans rather than Reserved Instances, because they float across instance family, region and even Fargate and Lambda. The predictable-but-not-permanent middle stays <strong>on-demand</strong>. The elastic top, plus all batch and CI, goes on <strong>Spot</strong> across a diversified set of instance types.</p><p>The number I want before committing is utilisation over the last 90 days at p10 — commit to the floor, not the average, because an over-commitment is unrecoverable and an under-commitment just costs on-demand rates on the margin.</p>"},
{lvl:"senior",q:"A service on t3.medium gets slow every afternoon. No deploys.",a:"<p>That daily shape with no code change points at <strong>CPU credit exhaustion</strong>. T instances accrue credits at a fixed rate and spend them above a baseline; a workload that averages above baseline drains the balance over hours, then gets throttled to baseline — which looks exactly like this.</p><p>I would confirm on the <code>CPUCreditBalance</code> metric hitting zero as the latency rises. Fix is either unlimited mode (which trades latency for a surcharge) or, properly, moving to an M or C instance sized from the real average — burstable instances suit spiky low-average workloads, not steady ones.</p><p>Worth saying out loud: I would check the <em>credit</em> metric, not just <code>CPUUtilization</code>, because utilisation looks pinned at the baseline and reads as normal.</p>"}
]},

qs:[
{lvl:"screen",q:"How do you let a mobile client upload a 2 GB video?",a:"<p>Not through my API. The server issues a <strong>presigned URL</strong> — or better, presigned POST or a multipart upload with presigned part URLs — and the client uploads straight to S3. That keeps large payloads off the application tier entirely.</p><p>Concretely: client asks the API for an upload target, the API authorises the user, generates a key it controls (so the client cannot choose the path), signs it with a short expiry, and returns it. The client uploads in parts, in parallel, resuming failed parts. Completion fires an S3 event that starts transcoding.</p><p>Details that matter: constrain content-length and content-type in the signed policy, expire in minutes not hours, and never sign with long-lived credentials.</p>"},
{lvl:"core",q:"Design the key layout for a data lake ingesting 50 GB/day of clickstream.",a:"<p>Keys are the index, so the layout follows the query pattern. Something like <code>s3://lake/events/clicks/dt=2026-09-02/hr=14/part-*.parquet</code>.</p><p>Three deliberate choices. <strong>Hive-style partitions</strong> (<code>dt=</code>, <code>hr=</code>) so Athena and Spark prune whole days instead of scanning the lake. <strong>Parquet, not JSON</strong> — columnar and compressed cuts scanned bytes by an order of magnitude, and Athena bills per byte scanned. <strong>File size around 128–512 MB</strong>, because thousands of tiny files make Spark and Athena spend all their time on metadata.</p><p>I would add a compaction job that rewrites the previous day's small files, a lifecycle rule to Glacier after 90 days, and — if there are updates or deletes — a table format like Iceberg on top rather than trying to mutate objects.</p>"},
{lvl:"core",q:"How do you serve private user files through CloudFront?",a:"<p>Origin Access Control on the distribution, with a bucket policy that only allows that distribution's service principal. Block all public access. Then the bucket is unreachable except through CloudFront.</p><p>For per-user authorisation, <strong>signed URLs or signed cookies</strong> from CloudFront — cookies when the user browses many assets, URLs for a single object. The application authenticates the user, then issues a short-lived signature.</p><p>The mistake to avoid is making the bucket public and relying on unguessable keys. That is not access control, it is obscurity, and it fails the moment a URL leaks into a referrer header or a log.</p>"},
{lvl:"senior",q:"Storage cost has quadrupled and nobody knows why. Investigate.",a:"<p>I would go to <strong>S3 Storage Lens</strong> and an inventory report first — guessing is expensive here.</p><p>The usual four causes, in order of how often I have actually seen them: <strong>noncurrent versions</strong> accumulating in a versioned bucket where deletes only wrote markers; <strong>incomplete multipart uploads</strong> from a failing uploader, which are billed but invisible in the object listing; <strong>logs with no expiry</strong>, especially access logs and CloudTrail data events writing to the same bucket they log; and a <strong>lifecycle rule that mis-fires</strong>, transitioning millions of tiny objects into IA where the 128 KB minimum billable size and per-object transition charge make them cost more.</p><p>The fixes are lifecycle rules: abort incomplete uploads after 7 days, expire noncurrent versions after 30, expire logs. Then Intelligent-Tiering for anything with unpredictable access, so this does not recur. I would also enable Storage Lens permanently — the reason nobody knew why is that nobody was looking.</p>"},
{lvl:"senior",q:"How would you make an S3-backed pipeline exactly-once when events are at-least-once?",a:"<p>You cannot make delivery exactly-once, so you make <em>processing</em> idempotent — and I would say that explicitly, because the question is testing whether I know the difference.</p><p>The object key plus its version ID or ETag is a natural idempotency key. Before processing, do a conditional write to DynamoDB with <code>attribute_not_exists(pk)</code>; if it fails, this event is a duplicate and we return successfully without redoing the work. Record completion in the same item so a crash mid-processing is distinguishable from a duplicate.</p><p>Outputs get the same treatment: write to a deterministic destination key derived from the input, so a re-run overwrites rather than appends. Then S3's own strong consistency means the second writer produces an identical object and downstream never sees a difference.</p>"}
]},

{
id:"elasticache", name:"Amazon ElastiCache", domain:"Databases", tier:1,
tagline:"Managed Redis/Valkey or Memcached. The answer to most read-latency questions.",
hook:"Cache questions are never about the cache. They are about <b>invalidation, stampedes and hot keys</b>.",
model:"Two engines. <strong>Redis/Valkey</strong> is a single-threaded (per shard) data structure server with replication, persistence, pub/sub, sorted sets, Lua and automatic failover. <strong>Memcached</strong> is a multi-threaded plain key-value cache with no replication and no persistence, sharded by the client. Almost every production answer is Redis; Memcached is for pure, disposable, horizontally-sharded caching.",
facts:[
"<strong>Cache-aside</strong> is the default pattern: read cache, miss, read database, write cache with a TTL. Write-through keeps the cache fresh at the cost of write latency; write-behind risks loss.",
"Redis cluster mode shards by hash slot across shards, each shard being a primary with replicas. Multi-AZ with automatic failover is the resilience story.",
"Redis is effectively single-threaded per shard, so one <code>KEYS *</code> or a big Lua script blocks everything on that shard.",
"Beyond caching, Redis is used for rate limiting (<code>INCR</code> with expiry), distributed locks, leaderboards (sorted sets), session stores and short-lived queues.",
"ElastiCache Serverless removes node sizing and scales capacity automatically."
],
numbers:[["Redis threading","single-threaded command execution per shard"],["Eviction policies","LRU, LFU, TTL, noeviction"],["Failover","automatic with Multi-AZ, seconds"],["Memcached","multi-threaded, no replication"],["Max item (Redis)","512 MB per value, but do not"]],
pick:{use:["Read-heavy workloads with a hot subset","Session storage, rate limiters, distributed locks, leaderboards","Absorbing repeated identical queries in front of RDS","Pub/sub or ephemeral queues at small scale"],avoid:["System of record — it is a cache, treat data as loseable","Write-heavy workloads with almost no reuse","Very large datasets where memory cost exceeds the database","Complex queries or joins — that is not what it is"]},
gotchas:[
"<strong>Cache stampede</strong>: a popular key expires and a thousand requests hit the database at once. Fix with jittered TTLs, a per-key lock so only one request refills, or serving stale while refreshing in the background.",
"<strong>Hot key</strong>: one key on one shard saturates it while other shards idle. Adding shards does not help — you need key splitting or a local in-process cache in front.",
"Double-write inconsistency: writing database then cache is not atomic. Prefer delete-on-write over update-on-write, so the next read repopulates from truth.",
"<code>KEYS</code> and <code>FLUSHALL</code> in production block the shard. Use <code>SCAN</code>.",
"No eviction policy plus a full cache means writes start failing rather than evicting.",
"A cache that must be warm for the system to survive is not a cache, it is an undeclared dependency — test a cold start."
],
qs:[
{lvl:"screen",q:"Redis or Memcached?",a:"<p>Redis for almost everything. It gives replication, Multi-AZ failover, persistence, and data structures that let you solve rate limiting, leaderboards and locking without extra infrastructure.</p><p>Memcached only when the workload is pure ephemeral key-value caching, there is genuinely nothing to lose on a node failure, and multi-threaded throughput on a single large node matters. That case exists but it is rare, and I would want to hear the specific reason before choosing it.</p>"},
{lvl:"core",q:"How do you keep the cache consistent with the database?",a:"<p>I would start by saying you cannot make it perfectly consistent without giving up the reason you added a cache — so the question is what staleness is acceptable.</p><p>Default: <strong>cache-aside with delete-on-write</strong>. Writes update the database and delete the cache key; the next read repopulates. Deleting is safer than updating because two concurrent writers updating the cache can land out of order, whereas two deletes are idempotent.</p><p>Where staleness is unacceptable, drive invalidation from the database's change stream — DynamoDB Streams, or Debezium on the binlog into Kafka — so invalidation is a consequence of the commit rather than a second write that can fail independently. And short TTLs everywhere as a backstop, so any missed invalidation self-heals within a bounded window.</p>"},
{lvl:"senior",q:"Your database CPU spikes to 100% every few minutes even though the cache hit rate is 95%. Why?",a:"<p>A 95% hit rate with periodic spikes says the misses are <em>correlated</em>, not random — this is a <strong>cache stampede</strong>.</p><p>The likely mechanism: many keys were populated at the same moment, typically after a deploy or cache flush, so they all carry the same TTL and expire together. Every expiry moment, thousands of concurrent requests miss simultaneously and all of them hit the database with the same query.</p><p>Three fixes, layered. <strong>TTL jitter</strong> — randomise expiry by ±10% so they de-synchronise. <strong>Single-flight refill</strong> — a short-lived Redis lock per key so only one request recomputes and the rest wait briefly or serve stale. <strong>Stale-while-revalidate</strong> — store a soft expiry inside the value, serve the stale value past it, and refresh asynchronously, so users never wait on a refill at all.</p><p>I would confirm the diagnosis first by correlating database QPS spikes with cache miss count and checking whether TTLs cluster.</p>"},
{lvl:"senior",q:"You need to rate limit an API to 1000 requests per minute per customer. Implement it.",a:"<p>Fixed windows are wrong at the boundary — a customer can send 1000 at 59 s and 1000 at 61 s. So I would use a <strong>sliding window</strong> or a <strong>token bucket</strong> in Redis.</p><p>Token bucket is my preference: one hash per customer holding token count and last-refill timestamp, updated inside a Lua script so read-modify-write is atomic on the shard. Lua matters here — doing it in three round trips from the application is a race under concurrency.</p><p>Operational points I would raise unprompted: key the limit on customer ID so one tenant cannot exhaust another; set a TTL on idle buckets so memory does not grow with every customer who ever called; watch for a hot key if one customer dominates; and decide the failure mode explicitly — if Redis is unreachable, do you fail open (available, unlimited) or closed (protected, unavailable)? For a paid API I would fail open with an alarm, because rate limiting is a protection mechanism, not a correctness one.</p>"}
]},

{
id:"dynamodb", name:"Amazon DynamoDB", domain:"Databases", tier:1,
tagline:"Managed key-value and document store with predictable latency at any scale — if you model for the access pattern.",
hook:"DynamoDB is not 'NoSQL RDS'. You design the table <b>from the queries backwards</b>, and if a new query appears you may need a new index.",
model:"Data is partitioned by hash of the partition key. Within a partition, items are sorted by sort key — which is what makes range queries fast and everything else slow. There are no joins, no ad-hoc queries, and scans are a design smell. In exchange you get single-digit-millisecond latency that does not degrade with table size.",
facts:[
"<strong>Query</strong> uses the partition key and optionally a sort key range: fast, bounded. <strong>Scan</strong> reads everything: slow, expensive, and almost always the wrong answer in an interview.",
"<strong>GSI</strong> has a different partition key, is eventually consistent, and has its own throughput. <strong>LSI</strong> shares the partition key, allows strong consistency, must exist at table creation, and caps that partition key at 10 GB.",
"<strong>Single-table design</strong> overloads one table with multiple entity types using composite keys (<code>PK=USER#123</code>, <code>SK=ORDER#2026-09-02</code>) so related entities co-locate and one query fetches them together.",
"Conditional writes (<code>attribute_not_exists</code>, version checks) give optimistic concurrency and are the standard idempotency primitive on AWS.",
"<strong>Streams</strong> emit an ordered per-partition-key change log, consumed by Lambda — the basis for cache invalidation, search indexing and event-driven fan-out."
],
numbers:[["Max item size","400 KB"],["Partition write ceiling","1,000 WCU"],["Partition read ceiling","3,000 RCU"],["1 WCU","1 KB/s write"],["1 RCU","4 KB/s strong, 8 KB/s eventual"],["Query result page","1 MB"],["Transaction limit","100 items / 4 MB"],["Streams retention","24 hours"],["PITR window","35 days"]],
pick:{use:["Known access patterns at high scale with strict latency needs","Session, user profile, IoT, order and event tables","Serverless stacks — it scales the way Lambda does","Idempotency and locking via conditional writes"],avoid:["Ad-hoc analytics, reporting or unknown future queries","Anything needing joins or complex transactions across many entities","Large binary data — put it in S3 and store the key","Low-scale relational apps where RDS is simpler and cheaper"]},
gotchas:[
"<strong>Hot partition</strong>: a partition key with low cardinality or a skewed distribution throttles even though total provisioned capacity looks fine. Adaptive capacity helps, it does not save you.",
"GSIs are eventually consistent — reading your own write through a GSI is a bug waiting to be reported.",
"If a GSI is under-provisioned it throttles <em>writes to the base table</em>, which is deeply unintuitive when you are debugging.",
"Scans in production code are the classic review finding: fine at 1,000 items, a cost and latency disaster at 10 million.",
"Item size limits push people to store blobs inline; keep them in S3.",
"Sequential partition keys (timestamps, auto-increment) concentrate writes on one partition — add a shard suffix."
],
qs:[
{lvl:"screen",q:"When do you pick DynamoDB over RDS?",a:"<p>When the access patterns are known and narrow, and the scale or latency requirement is real. DynamoDB gives you flat latency as data grows and no capacity planning, but you pay for it with rigidity — new query patterns need new indexes or a migration.</p><p>RDS wins when queries are unpredictable, when the data is genuinely relational with joins across several entities, or when the team wants SQL and reporting. Honestly, most CRUD applications at moderate scale are simpler and cheaper on Postgres, and I would say so rather than reaching for DynamoDB by reflex.</p>"},
{lvl:"core",q:"Model an e-commerce orders table. Users see their orders; support looks up by order ID; ops needs all pending orders.",a:"<p>Three access patterns, so I design keys for the first and indexes for the rest.</p><ul><li>Base table: <code>PK = USER#&lt;userId&gt;</code>, <code>SK = ORDER#&lt;timestamp&gt;#&lt;orderId&gt;</code>. Pattern one is a single Query, newest-first, paginated, and range queries by date come free from the sort key.</li><li>Support lookup by order ID: a <strong>GSI</strong> with <code>PK = ORDER#&lt;orderId&gt;</code>. Sparse and tiny.</li><li>All pending orders: a <strong>sparse GSI</strong> where the key attribute is only written while status is pending, and removed on completion. That keeps the index small — the size of the backlog, not the size of history.</li></ul><p>For the pending index I would shard the partition key (<code>PENDING#&lt;0-9&gt;</code>) so a burst of orders does not concentrate on one partition, and ops queries fan across the shards.</p><p>What I would flag: 'ops needs all pending orders' can quietly become 'ops needs to filter by six fields', and that is the point where I would push the data to OpenSearch or a warehouse instead of adding a seventh index.</p>"},
{lvl:"core",q:"How do you make a payment handler idempotent with DynamoDB?",a:"<p>The client sends an idempotency key. Before doing anything with side effects, I write a record with <code>PutItem</code> and a condition of <code>attribute_not_exists(pk)</code>, holding the key, a status of IN_PROGRESS and a TTL.</p><p>If the conditional write succeeds, this is the first attempt — process the payment, then update the item to COMPLETED with the stored response. If it fails with a condition-check exception, a previous attempt exists: if it is COMPLETED, return the stored response; if it is IN_PROGRESS, either wait briefly or return a 409, because a concurrent attempt is in flight.</p><p>The condition expression is the whole trick — it makes 'claim this key' a single atomic operation with no read-then-write race. I have used exactly this pattern with Kafka consumers, where at-least-once delivery makes it mandatory.</p>"},
{lvl:"senior",q:"You are getting throttled at 20% of provisioned capacity. Explain.",a:"<p>Provisioned capacity is a table-wide budget, but it is enforced <em>per partition</em>. If total capacity is spread over many partitions and traffic concentrates on one key, that partition hits its own ceiling — 1,000 WCU or 3,000 RCU — long before the table budget is used. That is a <strong>hot partition</strong>.</p><p>I would confirm with CloudWatch Contributor Insights for DynamoDB, which shows the most-accessed keys directly rather than making me guess.</p><p>Fixes depend on the cause. If the partition key is low cardinality or sequential — a date, a tenant ID where one tenant is 90% of traffic — <strong>write sharding</strong>: append a suffix, and fan out reads across suffixes. If it is a genuinely hot read key, put <strong>DAX</strong> or an application cache in front so repeated reads never reach the table. If the pattern is a time-series append, the date-based partition key is the problem itself and I would restructure it.</p><p>Switching to on-demand mode removes the provisioning question but not the per-partition physics, so it treats the symptom.</p>"},
{lvl:"senior",q:"Global tables are active-active. What breaks?",a:"<p>Conflict resolution is <strong>last writer wins</strong> on a timestamp. So two regions updating the same item concurrently silently discard one of the updates — no error, no merge, no notification. That is fine for a user profile and catastrophic for a counter or a balance.</p><p>Replication is also asynchronous, so a read in Mumbai right after a write in Frankfurt can miss it. Any read-your-writes requirement must be pinned to a home region.</p><p>How I would design around it: route each entity to a home region and only write there, using replication for read locality and disaster recovery rather than concurrent writes. Where genuine multi-region writes are needed, model the data as append-only events with a region-scoped key and derive state, so there is nothing to conflict on.</p><p>And I would raise the cost: every write is replicated and billed in each region, so a global table with five regions multiplies the write bill.</p>"}
]},

{
id:"rds", name:"Amazon RDS & Aurora", domain:"Databases", tier:1,
tagline:"Managed relational databases. Aurora rebuilds the storage layer for the cloud.",
hook:"RDS is <b>your database, operated by AWS</b>. Aurora is a re-architected engine where storage is a distributed service.",
model:"RDS runs MySQL, PostgreSQL, MariaDB, Oracle or SQL Server on instances with EBS, and manages backups, patching and failover. Aurora keeps the MySQL/Postgres wire protocol but replaces storage with a six-way replicated, three-AZ, log-structured distributed layer — which is why its replicas are faster to add and its failover is quicker.",

"<strong>Multi-AZ</strong> is availability, not scale: a synchronous standby that you cannot read from (in the classic RDS deployment). <strong>Read replicas</strong> are scale, asynchronous, and can lag.",

"Aurora <strong>writer endpoint</strong>, <strong>reader endpoint</strong> (load-balanced across replicas) and <strong>custom endpoints</strong> — pointing all traffic at the writer is the most common waste.",
"Aurora Serverless v2 scales capacity in fine-grained units in place, which suits spiky or dev workloads.",
"<strong>RDS Proxy</strong> pools connections, which is what makes Lambda plus RDS viable, and shortens failover by holding client connections open."
],
numbers:[["Aurora storage replication","6 copies across 3 AZs"],["Aurora replicas","up to 15"],["Aurora failover","typically under 30 s"],["RDS Multi-AZ failover","typically 60–120 s"],["Backup retention","up to 35 days"],["PITR","to any second in retention"]],
pick:{use:["Relational data with joins, transactions and unpredictable queries","Existing applications speaking SQL","Reporting and ad-hoc analysis at moderate volume","Aurora when you need fast replicas or fast failover"],avoid:["Internet-scale key-value with strict latency — DynamoDB","Analytics over terabytes — Redshift or Athena","Workloads with extreme write fan-out needing horizontal sharding","Anything where the connection count exceeds what a single writer tolerates"]},
gotchas:[
"Read replicas lag. Routing a read straight after a write to a replica gives users a stale answer — the classic read-your-writes bug.",
"There is one writer. Aurora scales reads beautifully and writes not at all beyond a bigger instance.",
"Serverless connection storms exhaust <code>max_connections</code>; RDS Proxy exists precisely for this.",
"Storage autoscaling grows but does not shrink.",
"Major version upgrades are not zero-downtime by default; blue-green deployments exist for this.",
"Aurora bills I/O in the standard configuration — an inefficient query pattern shows up as an I/O bill, not just latency."
],
qs:[
{lvl:"screen",q:"Multi-AZ versus read replica — what is the difference?",a:"<p>Different problems. <strong>Multi-AZ</strong> is a synchronous standby in another AZ for availability; you cannot read from it in the classic deployment, and its job is to take over on failure. <strong>Read replicas</strong> are asynchronous copies, readable, possibly cross-region, and exist to scale reads or to serve reporting away from the primary.</p><p>They compose: a production database usually has both. And a read replica can be promoted, which makes it a disaster-recovery tool as well — but promotion is not automatic, so it is not a substitute for Multi-AZ.</p>"},
{lvl:"core",q:"Lambda functions are exhausting your Postgres connections. Fix it.",a:"<p>The structural mismatch is that Lambda scales by process count and each process opens its own connection, while Postgres treats a connection as an expensive backend process. A thousand concurrent invocations means a thousand connections.</p><p>The direct fix is <strong>RDS Proxy</strong>: it maintains a warm pool and multiplexes many client connections onto few database connections, and it also holds client connections open across a failover so the blast radius is smaller.</p><p>Alongside that: set <strong>reserved concurrency</strong> on the function so the fan-out is bounded regardless of the proxy, create the client outside the handler so it is reused across warm invocations, and keep transactions short — pinning a session with a transaction defeats the proxy's multiplexing.</p><p>If the workload is a high-volume key lookup rather than relational work, I would question the datastore choice rather than tuning around it.</p>"},
{lvl:"senior",q:"Design zero-downtime for a major Postgres version upgrade on a 24×7 service.",a:"<p>I would use a <strong>blue-green deployment</strong>: RDS creates a synchronised green environment at the new version, replicating from blue, so I can run the full test suite and realistic read traffic against the new version before anything switches. Switchover stops writes briefly, waits for replication to catch up, and swaps endpoints — typically well under a minute.</p><p>What I would do around it. Before: check extension compatibility and any plan regressions on the new version, because the upgrade risk is usually the query planner, not the migration. Make the application tolerate a short write outage — queue writes or return a retryable error rather than failing the request. During: keep blue intact so rollback is an endpoint change, not a restore. After: watch p99 and the slow query log closely for a day, since plan changes surface under production data distribution, not in staging.</p><p>The honest caveat is that 'zero downtime' means seconds of write unavailability, and I would agree that number with the business rather than claim it is zero.</p>"}
]},

pick:{use:["EBS: boot volumes, databases, anything needing block IO","EFS: shared config or content across many instances, lift-and-shift of NFS apps","FSx Lustre: ML training or HPC reading a large S3 dataset","FSx Windows: SMB shares and Active Directory integration"],avoid:["EFS as a database volume — NFS latency will disappoint","EBS for anything shared across instances","EFS where S3 would do — it costs several times more per GB"]},

qs:[
{lvl:"core",q:"Fifty instances need to read the same 200 GB dataset. What do you use?",a:"<p>First question: do they need POSIX semantics, or just to read bytes? If the application can use an SDK, <strong>S3</strong> is the right answer — cheapest, unlimited parallel readers, no capacity planning.</p><p>If it must be a filesystem, then <strong>EFS</strong> for general shared access, or <strong>FSx for Lustre</strong> if this is training or HPC and throughput per client matters — Lustre links directly to the S3 bucket and gives far higher aggregate throughput.</p><p>What I would not do is copy the dataset to 50 EBS volumes; that is 10 TB of duplicated storage and a synchronisation problem.</p>"}

qs:[
{lvl:"core",q:"Athena or Redshift?",a:"<p><strong>Athena</strong> when queries are ad-hoc or intermittent: no cluster to run, pay per byte scanned, and the data stays in open formats in S3. Ideal for exploration, log analysis and pipelines that query occasionally.</p><p><strong>Redshift</strong> when the same complex queries run continuously — BI dashboards, big joins, sub-second repeated aggregations. The persistent cluster and physical tuning pay off exactly when usage is predictable and heavy.</p><p>The crossover is usage frequency. I have seen teams pay far more on Athena than a small Redshift Serverless would cost, because a dashboard refreshed every minute was scanning the same partitions all day.</p>"}

qs:[
{lvl:"screen",q:"SQS or SNS?",a:"<p>SQS is one-to-one and pull-based: a message is processed by exactly one consumer, and it waits until someone takes it. SNS is one-to-many and push-based: a message goes to every subscriber at that moment, and there is no storage if a subscriber is down.</p><p>In practice you use both — the <strong>fan-out pattern</strong>: publish once to an SNS topic, with an SQS queue subscribed per consuming service. Each service gets its own buffered, independently retryable copy, and a slow consumer cannot back-pressure the publisher or the other consumers.</p>"},
{lvl:"core",q:"Explain visibility timeout as if I were debugging with you.",a:"<p>When a consumer receives a message, SQS does not delete it — it hides it for the visibility timeout. That is a lease. If the consumer deletes it before the lease expires, it is gone. If the consumer crashes, the lease expires and the message reappears for someone else. That is how at-least-once delivery survives consumer failure.</p><p>The two failure modes fall straight out. Set it too short and a healthy but slow consumer has its message handed to a second consumer while it is still working — duplicates. Set it too long and a crashed consumer's message sits invisible for minutes before anyone retries it.</p><p>The fix for long-and-variable work is <code>ChangeMessageVisibility</code> — a heartbeat that extends the lease while work is genuinely in progress — rather than setting a huge static timeout.</p>"},
{lvl:"core",q:"You need ordering, but one slow customer must not block others.",a:"<p>FIFO with the <strong>message group ID set to the customer ID</strong>. SQS guarantees strict ordering within a group and processes different groups in parallel, so a backlog for one customer does not stall anyone else.</p><p>That is the same reasoning as choosing a Kafka partition key: ordering is a property you want <em>per entity</em>, almost never globally. Global ordering means a single consumer and no horizontal scale, and I would push back on any requirement that seems to ask for it until we have established the real ordering boundary.</p><p>The thing to watch is group cardinality: too few groups and you lose parallelism; a group with far more traffic than the others becomes a hot partition.</p>"},
{lvl:"senior",q:"Messages are piling up. Consumers look healthy. Walk me through it.",a:"<p>First I separate 'not consuming' from 'consuming too slowly', using <code>ApproximateAgeOfOldestMessage</code> alongside <code>NumberOfMessagesDeleted</code>. Rising depth with rising deletes is a throughput problem. Rising depth with flat deletes means work is not completing at all.</p><p>If deletes are flat: check whether messages are being received and then failing silently, which shows up as <code>ApproximateNumberOfMessagesNotVisible</code> being high — messages leased but never deleted. That is usually an exception after receive, so I would look for a poison message and confirm the DLQ is configured, because without one the same message recycles forever and consumes the whole consumer pool.</p><p>If deletes are healthy but slow: the bottleneck is downstream — a throttled database, a rate-limited API — and adding consumers will make it worse, not better. In that case I would cap consumer concurrency to what the downstream tolerates and let the queue do its job of absorbing the spike.</p><p>The scaling metric I would wire up afterwards is backlog per consumer, not raw depth, so autoscaling reacts to how long the backlog will take to drain.</p>"}
]},

{lvl:"core",q:"Why put SQS between SNS and a consumer?",a:"<p>Buffering and independent failure. A directly-subscribed Lambda that is throttled or broken drops events after its retries. With a queue in between, the events sit safely until the consumer recovers, retries are governed per consumer, and each consumer has its own DLQ.</p><p>It also decouples pace: a fast publisher and a slow consumer coexist, because the queue absorbs the difference. And adding a new consumer becomes adding a subscription and a queue, with no change to the publisher and no risk to existing consumers.</p>"}

qs:[
{lvl:"screen",q:"SQS or Kinesis?",a:"<p>The dividing line is whether you need the log. SQS deletes a message once it is processed, so exactly one consumer sees it and there is no history. Kinesis keeps records for the retention period, so multiple applications read independently and any of them can rewind.</p><p>So: work distribution — SQS. Event stream that several teams consume, or that you may need to reprocess — Kinesis. Ordering also splits them: Kinesis orders per shard by default, whereas SQS needs FIFO with message groups.</p>"},
{lvl:"core",q:"How do you choose a partition key?",a:"<p>Two competing goals: enough cardinality to spread evenly, and enough grouping that everything requiring order lands on one shard.</p><p>For per-user ordering, user ID is the natural key — but I would check the distribution first, because a key like country or device-type has too few distinct values and a key like a customer ID in a system with one dominant tenant is skewed.</p><p>If a single key genuinely is too hot, I would salt it — append a small random suffix so the load spreads — and accept that ordering is now per key-shard rather than per key, then reconcile downstream. That trade-off should be a conscious decision, not a surprise, and it is the same conversation as Kafka partitioning or DynamoDB write sharding.</p>"},
{lvl:"senior",q:"Kinesis or MSK for a new pipeline, given the team already runs Kafka?",a:"<p>If the team has real Kafka expertise and depends on the ecosystem — Kafka Connect, Streams, Schema Registry, exactly-once semantics with transactions, existing consumer code — then <strong>MSK</strong>, because rewriting all of that to gain a managed service is a bad trade.</p><p>If it is greenfield and the requirements are ordinary streaming into AWS analytics, <strong>Kinesis</strong> is less to operate: no brokers, no partition rebalancing, no ZooKeeper or KRaft version questions, and native integration with Lambda and Firehose.</p><p>The honest differences I would name: Kinesis has no exactly-once producer semantics comparable to Kafka transactions, its per-shard limits are fixed where Kafka partitions are tunable, and MSK still leaves you owning topic configuration, partition counts and consumer lag. MSK Serverless narrows the operational gap but not the expertise requirement.</p><p>Given a team already fluent in Kafka partitioning, I would lean MSK and spend the saved learning curve elsewhere.</p>"}
]},

qs:[
{lvl:"senior",q:"How do you get exactly-once from Kafka to DynamoDB?",a:"<p>Kafka's exactly-once applies within Kafka — transactional producers plus <code>read_committed</code> consumers give atomic read-process-write across topics. It does not extend to an external sink, so the honest answer is that the sink must be idempotent.</p><p>The pattern I would use: the consumer processes a record and writes to DynamoDB with a conditional expression keyed on something deterministic — topic, partition and offset, or a business idempotency key. A redelivery after a rebalance fails the condition and becomes a no-op. Then commit the offset after the write.</p><p>That ordering matters. Commit-then-write risks losing a record on crash; write-then-commit risks reprocessing, which the conditional write makes harmless. Choosing at-least-once plus idempotency over trying to make the whole path transactional is the senior answer here.</p>"}
]},

qs:[
{lvl:"senior",q:"Design an order workflow: reserve inventory, charge card, ship. Any step can fail.",a:"<p>This is a distributed transaction across three services with no shared database, so a two-phase commit is not on the table. I would implement a <strong>saga</strong> as a Standard workflow.</p><p>Each forward step has a compensating action: release the inventory reservation, refund the charge. Every task state gets a <code>Retry</code> block for transient errors — exponential backoff, capped attempts, retrying only retryable error types — and a <code>Catch</code> that routes to the compensation path for that stage. Failing after shipping routes to a manual review state rather than an automatic reversal, because some compensations are not safe to automate.</p><p>Two things I would insist on. Every downstream call carries an <strong>idempotency key</strong> derived from the execution ID, because Step Functions retries and duplicate charges are the failure everyone remembers. And the workflow holds an S3 pointer rather than the full order payload, staying under the state payload limit.</p><p>The reason I would choose this over orchestrating in application code is visibility: when an order is stuck, the execution history shows exactly which state failed and why, which is worth a great deal at 2 a.m.</p>"}
]},

{lvl:"core",q:"How do you protect a backend that can only handle 500 rps?",a:"<p>Layered limits, outermost first. At API Gateway, a stage-level throttle at 500 with a modest burst, plus usage plans so a single customer cannot consume the whole budget — per-key rate and quota. That turns overload into 429s at the edge, which are cheap and honest, instead of timeouts deep in the stack.</p><p>Behind that, if the work can be asynchronous, I would put SQS between the gateway and the backend and let consumers pull at a fixed concurrency. Then a spike becomes queue depth rather than rejection.</p><p>I would also make sure clients see <code>Retry-After</code> and that our SDK does exponential backoff with jitter, because synchronised retries after a throttle are how a brief overload becomes a sustained one.</p>"}

qs:[
{lvl:"screen",q:"EMR, Glue or Athena?",a:"<p><strong>Athena</strong> for SQL over data already in S3 — no infrastructure, pay per byte scanned, ideal for exploration and light pipelines.</p><p><strong>Glue</strong> for serverless Spark ETL where you want the Data Catalog, crawlers, bookmarks and visual job authoring, and you do not want to think about clusters.</p><p><strong>EMR</strong> when you need control: specific Spark or framework versions, custom libraries and native dependencies, deep tuning, non-Spark tools like HBase or Flink, or a cost profile that justifies managing Spot fleets.</p><p>My rule of thumb: start at Athena, move to Glue when it becomes a real pipeline, move to EMR when you are fighting Glue's abstraction or when the scale makes Spot savings worth the operational cost.</p>"},
{lvl:"core",q:"How do you run EMR cheaply without risking jobs?",a:"<p>Four levers, roughly in order of payoff.</p><ul><li><strong>Transient clusters</strong> — provision per job, terminate on completion. Idle clusters are the biggest waste I see.</li><li><strong>Spot on task nodes only</strong>, with instance fleets across many types and a capacity-optimised strategy. Core nodes stay on-demand so HDFS and the shuffle service survive.</li><li><strong>Graviton instances</strong>, which are typically a straightforward saving for Spark.</li><li><strong>Managed scaling</strong> with a sensible maximum, so the cluster grows for the shuffle stage and shrinks afterwards.</li></ul><p>Alongside that, the job itself matters more than the cluster: reading Parquet with partition pruning instead of JSON often cuts runtime by more than any instance choice. I would fix file formats and partitioning before tuning instance types.</p>"},
{lvl:"senior",q:"A Spark job on EMR runs in 20 minutes for six months, then takes four hours. Nothing changed in the code.",a:"<p>Code did not change, so the data did. Three candidates, and I would look at the Spark UI stage timeline first because it distinguishes them immediately.</p><p><strong>Data skew.</strong> If one task in a stage runs for hours while the others finish in seconds, a join or groupBy key has become concentrated — often a new dominant customer, or a flood of records with a null or default key. Fix by salting the hot key, broadcasting the small side, or filtering nulls out of the join.</p><p><strong>Small files.</strong> If the job is slow from the very first stage and the executors look idle, an upstream producer started writing many small objects and Spark is spending its time on S3 listing and task scheduling. Fix with compaction upstream and by tuning the input split size.</p><p><strong>Spill.</strong> If stages show heavy disk spill and GC time, the data outgrew executor memory. That is the one case where more or larger executors genuinely helps, though repartitioning usually helps more.</p><p>What I would not do is double the cluster size first. That converts a diagnosis problem into a bigger bill and typically does not help skew at all, since the long pole is a single task.</p>"}
]},

{lvl:"core",q:"An Athena query costs $40 each time. Reduce it.",a:"<p>Cost is bytes scanned, so I would attack bytes in four ways.</p><ul><li><strong>Convert to Parquet</strong> with compression — usually the single largest win, often an order of magnitude.</li><li><strong>Partition</strong> on the common filter columns, typically date, and make sure queries actually filter on the partition column so pruning happens.</li><li><strong>Select only needed columns</strong>, because columnar storage only pays off when you stop reading every column.</li><li><strong>Compact small files</strong> and consider partition projection if the partition count is large.</li></ul><p>Then I would check whether the query is repeated on a schedule — if a dashboard runs it hourly, a CTAS-materialised summary table turns 24 full scans a day into one.</p>"}
]},

],

{lvl:"core",q:"DynamoDB holds your products. Search needs to filter on eight optional fields. Design it.",a:"<p>DynamoDB cannot answer that — you would need an index per combination, which does not scale. So DynamoDB stays the system of record and OpenSearch becomes the query layer.</p><p>Pipeline: DynamoDB Streams to a Lambda that projects the searchable fields into an OpenSearch document. Search returns IDs; the application reads full items from DynamoDB, so the index carries only what it needs to filter on.</p><p>What I would call out: the index is eventually consistent, so a just-updated product may not appear in search for a second or two, and the UI should account for that. And because the index is derived, a full reindex from DynamoDB must be a routine, tested operation — that is what makes an OpenSearch outage a degradation rather than data loss.</p>"}

{
id:"sagemaker", name:"Amazon SageMaker & Bedrock", domain:"Analytics", tier:2,

],
qs:[
{lvl:"core",q:"Batch transform or a real-time endpoint?",a:"<p>Driven by when the prediction is consumed. If a user waits for it, real-time. If predictions feed a nightly table, a report or a downstream job, <strong>batch transform</strong> — it spins up, scores the dataset, writes to S3 and terminates, so there is nothing running between runs.</p><p>Two in-between cases worth naming: <strong>serverless inference</strong> for spiky low-volume traffic where an always-on endpoint is mostly idle, and <strong>asynchronous inference</strong> when payloads are large or inference takes minutes, since it queues requests and writes results to S3.</p><p>Getting this wrong in the expensive direction — a 24×7 GPU endpoint serving a nightly job — is common enough that I would check it early in any cost review.</p>"}
]}
