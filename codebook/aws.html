const QUIZ = [
{q:"A Lambda reading from SQS processes some messages twice. Which is the most likely cause?",o:["SQS is a FIFO queue","Visibility timeout is shorter than the function duration","The function has reserved concurrency set","The queue has no dead-letter queue"],a:1,w:"When processing outlasts the visibility timeout, SQS makes the message visible again and hands it to a second consumer while the first is still working. Rule of thumb: visibility timeout at least six times the function timeout — and make the handler idempotent regardless."},
{q:"You are throttled on DynamoDB at 20% of provisioned capacity. Why?",o:["The table needs on-demand mode","A hot partition is at its per-partition limit","GSIs are consuming the capacity","Eventually consistent reads cost more"],a:1,w:"Capacity is provisioned table-wide but enforced per partition — 1,000 WCU and 3,000 RCU each. Skewed or low-cardinality partition keys concentrate traffic on one partition. Write sharding or a cache in front is the fix; on-demand hides it without solving it."},
{q:"Which combination gives ordered processing without one slow customer blocking others?",o:["Standard SQS with one consumer","FIFO SQS with message group ID per customer","SNS with filter policies","Kinesis with one shard"],a:1,w:"FIFO guarantees ordering within a message group and processes groups in parallel. Same reasoning as a Kafka partition key: order per entity, parallelism across entities. One shard or one consumer would order everything globally and destroy throughput."},
{q:"A pod in EKS needs to read an S3 bucket. Best practice?",o:["Attach the policy to the node instance role","Use EKS Pod Identity or IRSA to map a service account to a role","Store access keys in a Kubernetes secret","Make the bucket public within the VPC"],a:1,w:"A node role grants the permission to every pod on that node. Pod Identity (current) or IRSA (OIDC federation) binds an IAM role to a specific service account, so identity is per workload."},
{q:"Cross-account S3 read is failing with access denied, and the bucket policy looks correct. What is most often missed?",o:["The bucket needs public access enabled","The KMS key policy must also allow the caller","S3 requires a VPC endpoint for cross-account","Versioning must be enabled"],a:1,w:"If objects are encrypted with a customer-managed key, the caller needs kms:Decrypt from the key policy as well. The error surfaces as an S3 access denied, which sends people to the wrong policy for hours."},
{q:"Which is true of a security group?",o:["Stateless, evaluated in rule order","Stateful, allow rules only","Stateless, supports deny rules","Applies at the subnet boundary"],a:1,w:"Security groups are stateful and allow-only, attached to an ENI. NACLs are the stateless, ordered, deny-capable layer at the subnet boundary."},
{q:"Athena queries cost far too much. The highest-leverage single fix?",o:["Add more Athena workgroups","Convert data to partitioned Parquet","Increase the query timeout","Move the data to EFS"],a:1,w:"Athena bills per byte scanned. Columnar format plus partition pruning routinely cuts scanned bytes by an order of magnitude or more. SELECT * defeats the columnar benefit, so fix that too."},
{q:"EMR Spot instances should be used on which node type?",o:["Primary","Core","Task","All three equally"],a:2,w:"Task nodes run compute only. Core nodes hold HDFS blocks and the primary coordinates the cluster, so losing either can fail the job. Task nodes on Spot with diversified instance fleets is the standard cost pattern."},
{q:"Cache hit rate is 95% but the database spikes to 100% periodically. Most likely?",o:["The cache is undersized","A cache stampede from synchronised TTL expiry","Replica lag on the database","Memcached does not support replication"],a:1,w:"Correlated misses, not random ones. Keys populated together expire together and thousands of requests miss at the same instant. Fix with TTL jitter, single-flight refill, and stale-while-revalidate."},
{q:"Which service lets multiple independent consumers read the same events and replay history?",o:["SQS standard","SQS FIFO","Kinesis Data Streams","SNS"],a:2,w:"A stream retains the log so consumers hold independent positions and can rewind. Queues delete on processing; SNS pushes with no storage for absent subscribers."},
{q:"IAM evaluation: an SCP denies an action but the role's identity policy allows it. Result?",o:["Allowed, identity policy wins","Denied, explicit deny always wins","Allowed if MFA is present","Depends on the permissions boundary"],a:1,w:"An explicit deny at any layer ends evaluation immediately. SCPs never grant permissions; they only bound what the account can do, including for its root user."},
{q:"Your ALB returns intermittent 502s with no code change. First thing to check?",o:["DNS TTL","Backend keep-alive timeout shorter than the ALB idle timeout","NACL rules","Route 53 health checks"],a:1,w:"The ALB reuses a connection the backend has just closed. Make the backend idle timeout comfortably longer than the ALB's 60 seconds. The other frequent cause is deregistration delay shorter than in-flight requests."},
{q:"Which is the right compute for 200,000 independent file-processing jobs that must finish overnight?",o:["Lambda, one invocation per file","AWS Batch array job on Spot","A single large EC2 instance","EKS with one pod per file"],a:1,w:"Independent, coarse-grained, deadline-bound and cost-sensitive: Batch with an array job on diversified Spot. Lambda per file works only if each file is under 15 minutes and the per-invocation overhead does not dominate."},
{q:"What does a permissions boundary do?",o:["Grants permissions to a role","Caps the maximum permissions an identity policy can grant","Applies to an entire AWS account","Replaces the need for resource policies"],a:1,w:"A boundary is a ceiling, never a grant. Effective permissions are the intersection of the identity policy and the boundary. It is what makes delegating role creation safe."},
{q:"Firehose versus Kinesis Data Streams — which statement is right?",o:["Firehose supports replay","Firehose is near-real-time with no replay","Data Streams cannot deliver to S3","Firehose guarantees ordering per key"],a:1,w:"Firehose buffers and delivers, then forgets. If the destination was misconfigured, that data is gone. Data Streams retains the log, which is what enables replay and multiple independent consumers."},
{q:"Storage bill quadrupled on a versioned S3 bucket. Most likely cause?",o:["Objects moved to Glacier","Noncurrent versions and incomplete multipart uploads accumulating","Cross-region replication was disabled","Strong consistency was enabled"],a:1,w:"Deletes on a versioned bucket write markers; the data and the bill remain. Incomplete multipart uploads bill invisibly. Lifecycle rules to expire noncurrent versions and abort incomplete uploads fix both."},
{q:"Where does an interface VPC endpoint differ from a gateway endpoint?",o:["Gateway endpoints cost hourly, interface endpoints are free","Interface endpoints create an ENI and bill hourly plus data","Gateway endpoints work for all services","Interface endpoints only work for S3"],a:1,w:"Gateway endpoints exist for S3 and DynamoDB, work through the route table, and are free. Interface endpoints (PrivateLink) place an ENI in your subnet for many services and bill hourly plus data processed."},
{q:"Aurora Multi-AZ versus read replicas — what is the difference in purpose?",o:["Both scale reads equally","Multi-AZ is availability, replicas scale reads","Multi-AZ is cheaper than replicas","Replicas are synchronous"],a:1,w:"Multi-AZ is a standby for failover. Read replicas are readable, asynchronous and exist to scale reads or offload reporting. They complement each other; a production database usually has both."},
{q:"Step Functions Standard versus Express — key difference?",o:["Express supports longer workflows","Standard is exactly-once, Express is at-least-once","Express has full execution history","Standard is cheaper at high volume"],a:1,w:"Standard runs up to a year with exactly-once semantics and full history, billed per state transition. Express runs up to five minutes at-least-once, billed by duration and requests — far cheaper at high volume, but steps must be idempotent."},
{q:"Which metric best detects a stalled SQS consumer?",o:["ApproximateNumberOfMessagesVisible","ApproximateAgeOfOldestMessage","NumberOfMessagesSent","CPU utilisation of consumers"],a:1,w:"Depth can look stable while a consumer falls behind. Age of the oldest message directly measures how long work has been waiting, which is what the user actually experiences."},
{q:"Envelope encryption exists mainly because:",o:["KMS cannot encrypt data over about 4 KB","AES is not supported in AWS","It is required for compliance","Data keys are cheaper than KMS keys"],a:0,w:"KMS encrypts small payloads only, and round-tripping bulk data through a network service would be slow and expensive. GenerateDataKey returns a key in plaintext and encrypted form; you encrypt locally and store the encrypted key with the ciphertext."},
{q:"A Spark job on EMR suddenly takes 12× longer with no code change. Stage timeline shows one task running for hours. Diagnosis?",o:["Cluster is undersized","Data skew on a join key","S3 throttling","Spot interruption"],a:1,w:"One long task while the rest finish is skew — a key became concentrated. Salting, broadcast joins, or filtering null keys fixes it. Adding nodes does not help, since the long pole is a single task."},
{q:"You need static IPs for a client firewall allowlist. Which load balancer?",o:["ALB","NLB","Gateway Load Balancer","CloudFront"],a:1,w:"NLB provides a static IP per AZ and supports Elastic IPs. ALB IPs change, so allowlisting them is not viable."},
{q:"DynamoDB global tables resolve concurrent conflicting writes by:",o:["Rejecting the second write","Last writer wins","Merging attributes","Locking the item across regions"],a:1,w:"Last writer wins on timestamp, silently. Fine for a profile update, dangerous for a counter or balance. Route each entity to a home region, or model as append-only events."},
{q:"Which is the cheapest way to keep private S3 content behind CloudFront?",o:["Make the bucket public with obscure keys","Origin Access Control plus signed URLs","A NAT gateway in front of the bucket","Copy objects to EFS"],a:1,w:"OAC restricts the bucket to the distribution's service principal; signed URLs or cookies authorise per user. Unguessable keys are obscurity, not access control, and leak through referrers and logs."}
];

const EXTRA_CARDS = [
{f:"IAM policy evaluation order",b:"Explicit deny anywhere → SCP must allow → resource control policy → permissions boundary → session policy → an explicit Allow in an identity or resource policy → otherwise implicit deny."},
{f:"Security group vs NACL, in four words",b:"Stateful instance, stateless subnet. Security groups: allow-only, attach to ENI, can reference other groups. NACLs: ordered rules, support deny, need return-traffic rules."},
{f:"Concurrency from a traffic number",b:"Concurrency = arrival rate × average duration. 500 req/s at 200 ms = 100 concurrent. Use it for Lambda limits, connection pools and thread pools alike."},
{f:"The claim-check pattern",b:"When a 256 KB message limit binds (SQS, SNS, EventBridge, Step Functions), store the payload in S3 and pass the key. Applies whenever the transport is smaller than the data."},
{f:"Idempotency on AWS, the default recipe",b:"Conditional write to DynamoDB on attribute_not_exists(idempotencyKey) before any side effect; store the result and return it on retry. Turns at-least-once delivery into effectively-once processing."},
{f:"Why the cache did not help",b:"Stampede (synchronised TTLs), hot key (one shard saturated), or stale writes (updating instead of deleting the key). Jitter TTLs, single-flight refill, delete-on-write."},
{f:"The two cost lines nobody predicts",b:"NAT gateway data processing, and cross-AZ data transfer billed in both directions. Gateway endpoints for S3 and DynamoDB are free and remove the first."},
{f:"When a queue is the wrong answer",b:"When multiple teams need the same events, when you may need to replay after a bug, or when ordering across many consumers matters. Those are stream requirements."},
{f:"Read-your-writes on a read replica",b:"Replicas lag. Route reads that immediately follow a write to the writer, or use a session-consistency token. This is the classic 'I saved it and it disappeared' bug."},
{f:"Five lenses for a design question",b:"Traffic, Data, Failure, Security, Bill. Walk them in order out loud and you will not miss a dimension under pressure."}
];
/* ---------- persistence (best effort) ---------- */
const Store = {
  data:{recall:{},quiz:{}},
  async load(){
    try{ if(window.storage){ const r=await window.storage.get("awsbook"); if(r&&r.value) this.data=Object.assign(this.data,JSON.parse(r.value)); } }catch(e){}
  },
  save(){ try{ if(window.storage) window.storage.set("awsbook",JSON.stringify(this.data)); }catch(e){} }
};

/* ---------- in-memory route (never touches the URL) ---------- */
let ROUTE = "/";
let CUR_SVC = null;
function go(path){ ROUTE = path; searchTerm = ""; const b=document.getElementById("q"); if(b) b.value=""; render(); }

const byId = id => SERVICES.find(s=>s.id===id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const DOMAINS = ["Compute","Storage","Databases","Messaging","Analytics","Networking","Security","Operations"];

/* Authoring convenience: chapters are written with href="#/path".
   Rewrite them into in-frame navigation so nothing ever leaves the sandbox. */
function delink(html){
  return html.replace(/href="#(\/[^"]*)"/g, 'data-go="$1" tabindex="0" role="link"');
}

/* ---------- rail ---------- */
function renderRail(){
  const on = p => ROUTE===p ? "on" : "";
  let h = '<h4>The book</h4>';
  h += `<a data-go="/" class="${on("/")}">Cold open</a>`;
  GUIDES.forEach(g=>{ h += `<a data-go="/guide/${g.id}" class="${on("/guide/"+g.id)}">${g.nav}</a>`; });
  h += `<a data-go="/duels" class="${on("/duels")}">Decision tables</a>`;
  h += '<h4>Practice</h4>';
  h += `<a data-go="/cards" class="${on("/cards")}">Recall cards</a>`;
  h += `<a data-go="/quiz" class="${on("/quiz")}">Quiz</a>`;
  DOMAINS.forEach(d=>{
    const list = SERVICES.filter(s=>s.domain===d);
    if(!list.length) return;
    h += `<h4>${d}</h4>`;
    list.forEach(s=>{
      const r = Store.data.recall[s.id]||"new";
      h += `<a data-go="/svc/${s.id}" class="${on("/svc/"+s.id)}"><i class="dot" data-r="${r}"></i>${s.name}</a>`;
    });
  });
  document.getElementById("rail").innerHTML = h;
}

/* ---------- home ---------- */
let coldQ = null;
function drawCold(){
  const pool=[];
  SERVICES.forEach(s=>s.qs.forEach(q=>pool.push({s,q})));
  coldQ = pool[Math.floor(Math.random()*pool.length)];
}
function renderHome(){
  if(!coldQ) drawCold();
  const {s,q} = coldQ;
  const counts = {solid:0,shaky:0};
  SERVICES.forEach(x=>{const r=Store.data.recall[x.id]; if(r&&counts[r]!==undefined) counts[r]++;});
  return `
  <div class="cols"><div>
    <h1>The interview starts like this</h1>
    <p class="lede">No warm-up, no definitions. Someone picks a service you listed on your CV and asks you to defend a decision. Try this one before you read the answer.</p>
    <div class="cold">
      <div class="cold-h"><span>${s.name} · ${q.lvl} round</span><span>drawn at random</span></div>
      <div class="cold-b">
        <p class="cold-q">${q.q}</p>
        <div class="cold-a" id="coldA">${q.a}</div>
      </div>
      <div class="cold-f">
        <button class="btn" id="coldFlip">Show a strong answer</button>
        <button class="btn ghost" id="coldNext">Draw another</button>
        <button class="btn ghost" data-go="/svc/${s.id}">Read ${s.name}</button>
      </div>
    </div>
    <h2>What is in here</h2>
    <p>${SERVICES.length} service chapters, each written as trade-off, failure mode and interview answer rather than documentation. Six decision tables for the comparison questions. Six design walkthroughs. A recall deck and a quiz that both pull from what you have marked shaky.</p>
    <div class="grid">
      <a class="card" data-go="/guide/start"><b>How to use this book</b><em>Three answer frameworks that survive pressure</em></a>
      <a class="card" data-go="/guide/companies"><b>By company type</b><em>What product companies, startups and enterprises each test</em></a>
      <a class="card" data-go="/duels"><b>Decision tables</b><em>Six head-to-head comparisons with the deciding variable named</em></a>
      <a class="card" data-go="/guide/designs"><b>Design playbooks</b><em>Six walkthroughs, reasoning first</em></a>
      <a class="card" data-go="/guide/numbers"><b>Numbers to know</b><em>Limits worth quoting correctly</em></a>
      <a class="card" data-go="/guide/plan"><b>Four-week plan</b><em>An hour a day, in order</em></a>
    </div>
    <h2>Start with these seven</h2>
    <p>They carry most of the question volume in most rounds.</p>
    <div class="grid">
    ${["iam","s3","dynamodb","sqs","vpc","lambda","ecs"].map(id=>{const x=byId(id);return `<a class="card" data-go="/svc/${id}"><b>${x.name}</b><em>${x.tagline}</em></a>`;}).join("")}
    </div>
  </div>
  <aside class="marg">
    <div class="note"><b>Your progress</b>${counts.solid} marked solid, ${counts.shaky} marked shaky, ${SERVICES.length-counts.solid-counts.shaky} untouched. Marks drive the recall deck.</div>
    <div class="note"><b>A note on limits</b>Quotas move. Every number here is a rule of thumb worth quoting, not a contract — say roughly, and say you would check.</div>
    <div class="note"><b>Print it</b>Print from the browser and answers expand inline, so this works as a paper revision pack on the way to an interview.</div>
  </aside></div>`;
}

/* ---------- service page ---------- */
function renderService(id){
  const s = byId(id);
  if(!s) return `<p class="empty">Nothing at that address.</p>`;
  CUR_SVC = id;
  const r = Store.data.recall[id]||"new";
  const lvlOrder={screen:0,core:1,senior:2};
  const qs = s.qs.slice().sort((a,b)=>lvlOrder[a.lvl]-lvlOrder[b.lvl]);
  return `
  <div class="crumb"><a data-go="/">Book</a> / ${s.domain}</div>
  <div class="cols"><div>
    <h1>${s.name}</h1>
    <p class="lede">${s.tagline}</p>
    <div class="hook"><b>Hold this in your head</b>${s.hook}</div>
    <h2>Mental model</h2>
    <p>${s.model}</p>
    <ul>${s.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
    <h2>Choosing it</h2>
    <div class="pick">
      <div><h5>Pick it when</h5><ul>${s.pick.use.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div><h5>Do not pick it when</h5><ul>${s.pick.avoid.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </div>
    <h2>How it breaks</h2>
    <div class="gotcha"><ul>${s.gotchas.map(g=>`<li><span>${g}</span></li>`).join("")}</ul></div>
    <h2>Questions and strong answers</h2>
    <div class="qa">
      ${qs.map((q,i)=>`<div class="q">
        <button data-ans="a-${id}-${i}"><span class="qn">${String(i+1).padStart(2,"0")}</span><span class="qlvl ${q.lvl}">${q.lvl}</span><span>${q.q}</span></button>
        <div class="ans" id="a-${id}-${i}">${q.a}</div>
      </div>`).join("")}
    </div>
    <div class="recall">
      <span>How well do you know this?</span>
      <button data-recall="solid" aria-pressed="${r==="solid"}">Solid</button>
      <button data-recall="shaky" aria-pressed="${r==="shaky"}">Shaky</button>
      <button data-recall="new" aria-pressed="${r==="new"}">Clear</button>
    </div>
  </div>
  <aside class="marg">
    <div class="note"><b>Numbers</b><table class="nums">${s.numbers.map(n=>`<tr><td>${n[0]}</td><td>${n[1]}</td></tr>`).join("")}</table></div>
    <div class="note"><b>Say this early</b>${s.hook.replace(/<\/?b>/g,"")}</div>
    <div class="note"><b>Related</b>${SERVICES.filter(x=>x.domain===s.domain&&x.id!==s.id).map(x=>`<a data-go="/svc/${x.id}">${x.name}</a>`).join("<br>")}</div>
  </aside></div>`;
}

/* ---------- guides & duels ---------- */
function renderGuide(id){
  const g = GUIDES.find(x=>x.id===id);
  if(!g) return `<p class="empty">Nothing at that address.</p>`;
  return `<div class="crumb"><a data-go="/">Book</a></div><div class="cols"><div><h1>${g.title}</h1>${delink(g.html)}</div><aside class="marg">
    <div class="note"><b>In this book</b>${GUIDES.filter(x=>x.id!==id).map(x=>`<a data-go="/guide/${x.id}">${x.nav}</a>`).join("<br>")}<br><a data-go="/duels">Decision tables</a></div>
  </aside></div>`;
}
function renderDuels(){
  return `<div class="crumb"><a data-go="/">Book</a></div>
  <h1>Decision tables</h1>
  <p class="lede">Comparison questions want one deciding variable, then the detail. The bottom row of each table is the sentence to say first.</p>
  ${DUELS.map(d=>`
    <h2>${d.title}</h2>
    <p>${d.note}</p>
    <div class="scroller"><table class="duel">
      <tr><th></th>${d.cols.map(c=>`<th>${c}</th>`).join("")}</tr>
      ${d.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
    </table></div>`).join("")}
  <hr class="soft">
  <p class="kicker">Every one of these is really the same question: what is the variable that decides it? Name that first and the rest of the answer writes itself.</p>`;
}

/* ---------- flashcards ---------- */
let deck=[], di=0, flipped=false, deckMode="all";
function buildDeck(){
  const out=[];
  SERVICES.forEach(s=>{
    if(deckMode==="shaky" && Store.data.recall[s.id]!=="shaky") return;
    out.push({svc:s.id,f:`${s.name} — when do you pick it?`,b:s.pick.use.slice(0,3).map(x=>"• "+x).join("<br>")});
    out.push({svc:s.id,f:`${s.name} — what breaks first in production?`,b:s.gotchas[0]});
    if(s.gotchas[1]) out.push({svc:s.id,f:`${s.name} — name another failure mode`,b:s.gotchas[1]});
    s.numbers.slice(0,2).forEach(n=>out.push({svc:s.id,f:`${s.name}: ${n[0]}?`,b:n[1]}));
  });
  if(deckMode==="all") EXTRA_CARDS.forEach(c=>out.push(c));
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
  deck=out; di=0; flipped=false;
}
function renderCards(){
  if(!deck.length) buildDeck();
  if(!deck.length) return `<h1>Recall cards</h1><p class="empty">No services marked shaky yet. Mark a few as you read, or switch back to the full deck.</p>
    <button class="btn" data-deck="all">Use the full deck</button>`;
  const c = deck[di];
  return `<div class="fc-wrap">
    <div class="fc-meta"><span>${di+1} of ${deck.length}</span><span>${deckMode==="shaky"?"shaky only":"full deck"}</span></div>
    <div class="fc" id="fc">
      <div class="front">${c.f}</div>
      ${flipped?`<div class="back">${c.b}</div>`:``}
    </div>
    <div class="fc-bar">
      <button class="btn ghost" data-card="prev">Back</button>
      <button class="btn" data-card="flip">${flipped?"Hide":"Reveal"}</button>
      <button class="btn ghost" data-card="next">Next</button>
      ${c.svc?`<button class="btn ghost" data-card="shaky">Mark shaky</button><button class="btn ghost" data-card="solid">Mark solid</button>`:``}
    </div>
    <div class="fc-bar" style="margin-top:18px">
      <button class="btn ghost" data-deck="${deckMode==="all"?"shaky":"all"}">${deckMode==="all"?"Shaky only":"Full deck"}</button>
      <button class="btn ghost" data-deck="reshuffle">Reshuffle</button>
      ${c.svc?`<button class="btn ghost" data-go="/svc/${c.svc}">Open chapter</button>`:``}
    </div>
    <p class="hint"><kbd>space</kbd> reveal · <kbd>←</kbd> <kbd>→</kbd> move · <kbd>1</kbd> shaky · <kbd>2</kbd> solid</p>
  </div>`;
}

/* ---------- quiz ---------- */
let quizSet=[], qi=0, answered=null, score=0;
function startQuiz(){
  quizSet = QUIZ.slice();
  for(let i=quizSet.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quizSet[i],quizSet[j]]=[quizSet[j],quizSet[i]];}
  quizSet = quizSet.slice(0,12); qi=0; answered=null; score=0;
}
function renderQuiz(){
  if(!quizSet.length) startQuiz();
  if(qi>=quizSet.length){
    const pct = Math.round(score/quizSet.length*100);
    const verdict = pct>=85?"That is interview-ready on these topics.":pct>=60?"Solid base. The misses are your revision list.":"Worth another pass through the chapters before a mock round.";
    return `<div class="quiz"><h1>${score} of ${quizSet.length}</h1><p class="lede">${verdict}</p>
      <button class="btn" data-quiz="restart">Run another set</button></div>`;
  }
  const q = quizSet[qi];
  return `<div class="quiz">
    <div class="bar"><i style="width:${(qi/quizSet.length*100).toFixed(0)}%"></i></div>
    <div class="crumb">Question ${qi+1} of ${quizSet.length} · score ${score}</div>
    <h1 style="font-size:22px;margin-bottom:16px">${q.q}</h1>
    ${q.o.map((o,i)=>{
      let cls="opt";
      if(answered!==null){ if(i===q.a) cls+=" right"; else if(i===answered) cls+=" wrong"; else cls+=" dim"; }
      return `<button class="${cls}" data-opt="${i}"${answered!==null?" disabled":""}>${o}</button>`;
    }).join("")}
    ${answered!==null?`<div class="why">${q.w}</div><button class="btn" data-quiz="next">${qi+1<quizSet.length?"Next question":"See score"}</button>`:``}
  </div>`;
}

/* ---------- search ---------- */
let searchTerm="";
function renderSearch(term){
  const t = term.toLowerCase();
  const hits = SERVICES.filter(s =>
    (s.name+" "+s.tagline+" "+s.domain+" "+s.model+" "+s.facts.join(" ")+" "+s.gotchas.join(" ")+" "+s.qs.map(q=>q.q).join(" ")).toLowerCase().includes(t));
  const gh = GUIDES.filter(g=>(g.title+" "+g.html).toLowerCase().includes(t));
  if(!hits.length && !gh.length) return `<h1>No match for “${esc(term)}”</h1><p class="empty">Try a service name, a concept like idempotency or skew, or a symptom like throttling.</p>`;
  return `<h1>${hits.length+gh.length} results for “${esc(term)}”</h1>
    <div class="grid">${hits.map(s=>`<a class="card" data-go="/svc/${s.id}"><b>${s.name}</b><em>${s.tagline}</em></a>`).join("")}
    ${gh.map(g=>`<a class="card" data-go="/guide/${g.id}"><b>${g.title}</b><em>${g.nav}</em></a>`).join("")}</div>`;
}

/* ---------- render ---------- */
function render(){
  const page = document.getElementById("page");
  let html;
  if(searchTerm) html = renderSearch(searchTerm);
  else if(ROUTE.startsWith("/svc/")) html = renderService(ROUTE.slice(5));
  else if(ROUTE.startsWith("/guide/")) html = renderGuide(ROUTE.slice(7));
  else if(ROUTE==="/duels") html = renderDuels();
  else if(ROUTE==="/cards") html = renderCards();
  else if(ROUTE==="/quiz") html = renderQuiz();
  else html = renderHome();
  page.innerHTML = html;
  renderRail();
  const m = ROUTE==="/cards"?"cards":ROUTE==="/quiz"?"quiz":"book";
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===m));
  page.scrollIntoView({block:"start"});
  document.getElementById("rail").classList.remove("open");
}

/* ---------- events ---------- */
function handle(t){
  if(!t) return;
  if(t.id==="menuBtn"){ document.getElementById("rail").classList.toggle("open"); return; }
  if(t.id==="night"){
    const on = document.documentElement.getAttribute("data-night")==="1";
    document.documentElement.setAttribute("data-night", on?"0":"1");
    Store.data.night = on?"0":"1"; Store.save(); return;
  }
  if(t.dataset.go !== undefined){ go(t.dataset.go); return; }
  if(t.dataset.mode){ go(t.dataset.mode==="book"?"/":"/"+t.dataset.mode); return; }
  if(t.dataset.ans){ const a=document.getElementById(t.dataset.ans); if(a) a.classList.toggle("open"); return; }
  if(t.id==="coldFlip"){
    const a=document.getElementById("coldA"); a.classList.toggle("open");
    t.textContent = a.classList.contains("open")?"Hide the answer":"Show a strong answer"; return;
  }
  if(t.id==="coldNext"){ drawCold(); render(); return; }
  if(t.dataset.recall){
    if(t.dataset.recall==="new") delete Store.data.recall[CUR_SVC]; else Store.data.recall[CUR_SVC]=t.dataset.recall;
    Store.save(); render(); return;
  }
  if(t.id==="fc" || t.dataset.card==="flip"){ flipped=!flipped; render(); return; }
  if(t.dataset.card==="next"){ di=(di+1)%deck.length; flipped=false; render(); return; }
  if(t.dataset.card==="prev"){ di=(di-1+deck.length)%deck.length; flipped=false; render(); return; }
  if(t.dataset.card==="shaky"||t.dataset.card==="solid"){
    const c=deck[di]; if(c && c.svc){ Store.data.recall[c.svc]=t.dataset.card; Store.save(); }
    di=(di+1)%deck.length; flipped=false; render(); return;
  }
  if(t.dataset.deck){
    if(t.dataset.deck!=="reshuffle") deckMode=t.dataset.deck;
    buildDeck(); ROUTE="/cards"; render(); return;
  }
  if(t.dataset.opt!==undefined && answered===null){
    answered = Number(t.dataset.opt);
    if(answered===quizSet[qi].a) score++;
    render(); return;
  }
  if(t.dataset.quiz==="next"){ qi++; answered=null; render(); return; }
  if(t.dataset.quiz==="restart"){ startQuiz(); render(); return; }
}

const SEL = "[data-go],[data-ans],[data-recall],[data-card],[data-deck],[data-opt],[data-quiz],[data-mode],#coldFlip,#coldNext,#menuBtn,#night,#fc";
document.addEventListener("click", e=>{
  const t = e.target.closest(SEL);
  if(!t) return;
  e.preventDefault();
  handle(t);
});
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter" && e.key!==" ") return;
  const t = e.target.closest && e.target.closest("[data-go][role='link']");
  if(t){ e.preventDefault(); handle(t); }
});

document.addEventListener("keydown", e=>{
  if(ROUTE!=="/cards") return;
  if(document.activeElement && document.activeElement.tagName==="INPUT") return;
  if(e.key===" "){ e.preventDefault(); flipped=!flipped; render(); }
  if(e.key==="ArrowRight"){ di=(di+1)%deck.length; flipped=false; render(); }
  if(e.key==="ArrowLeft"){ di=(di-1+deck.length)%deck.length; flipped=false; render(); }
  if(e.key==="1"||e.key==="2"){
    const c=deck[di]; if(c && c.svc){ Store.data.recall[c.svc]= e.key==="1"?"shaky":"solid"; Store.save(); }
    di=(di+1)%deck.length; flipped=false; render();
  }
});

let searchTimer;
document.getElementById("q").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  searchTimer = setTimeout(()=>{ searchTerm = v; render(); }, 140);
});

function sizeHeader(){
  const t=document.querySelector(".top");
  if(t) document.documentElement.style.setProperty("--topH", t.offsetHeight+"px");
}
window.addEventListener("resize", sizeHeader);

(async function init(){
  sizeHeader();
  await Store.load();
  if(Store.data.night==="1") document.documentElement.setAttribute("data-night","1");
  render();
})();
</script>
