{
id:"iam", name:"IAM & Policy Evaluation", domain:"Security", tier:1,
tagline:"Who can do what, to which resource, under what conditions. The most reliably asked AWS topic.",
hook:"Every access decision is <b>Deny wins, then an explicit Allow, otherwise deny</b>. Everything else is detail on top of that sentence.",
model:"A request carries a principal, an action, a resource and a context. AWS collects every policy that applies — SCPs, resource control policies, identity policies, resource policies, permissions boundaries, session policies — and evaluates them. An explicit Deny anywhere ends it. Otherwise every applicable policy type must permit the action, and the default is deny.",
facts:[
"<strong>Evaluation order</strong>: explicit Deny anywhere → SCP must allow → resource control policy must allow → permissions boundary must allow → session policy must allow → an Allow must exist in an identity or resource policy → otherwise implicit deny.",
"<strong>Identity policies</strong> attach to users, groups and roles. <strong>Resource policies</strong> attach to the resource (S3 bucket, SQS queue, KMS key) and can name a principal in another account.",
"Cross-account access needs both sides: the resource policy trusts the external principal <em>and</em> the principal's own account grants it. Except for KMS, where the key policy must explicitly allow IAM to apply at all.",
"<strong>Permissions boundary</strong> is a ceiling, not a grant. It caps what an identity policy can give, which is how you safely let teams create their own roles.",
"<strong>Roles, not keys.</strong> EC2 instance profiles, ECS task roles, EKS Pod Identity and OIDC federation all exist so long-lived access keys never need to exist.",
"Condition keys are where real policies get expressive: <code>aws:PrincipalOrgID</code>, <code>aws:SourceIp</code>, <code>aws:SourceArn</code>, <code>aws:RequestTag</code>, <code>aws:MultiFactorAuthPresent</code>."
],
numbers:[["Default","implicit deny"],["Explicit deny","always wins, everywhere"],["Managed policies per role","10 (plus one inline)"],["Session duration","1 h default, up to 12 h"],["Policy language","JSON with Effect, Action, Resource, Condition"]],
pick:{use:["Roles for every workload identity","Permissions boundaries when delegating role creation","SCPs for organisation-wide guardrails","ABAC with tags when the identity count grows faster than the resource count"],avoid:["Long-lived access keys in code or CI","Wildcard actions on wildcard resources in anything reachable","Sharing one role across services to avoid writing policies"]},
gotchas:[
"An SCP that allows nothing denies everything for member accounts, even the root user of that account.",
"A KMS key policy that does not delegate to IAM makes IAM policies on that key irrelevant — a very common cross-account failure.",
"<code>iam:PassRole</code> is the sleeper privilege escalation: the power to pass a role to a service is the power to use its permissions.",
"Resource-based policies grant to a principal in another account, but the other account must also allow it — people debug one side for hours.",
"NotAction and NotResource invert in ways that surprise reviewers; prefer explicit lists.",
"Access Analyzer findings are the fastest way to discover resources shared outside the organisation."
],
qs:[
{lvl:"screen",q:"Walk me through how AWS decides whether a request is allowed.",a:"<p>Start with the default: everything is denied. Then AWS gathers every policy in scope and applies them in a fixed order.</p><ol><li>Is there an <strong>explicit Deny</strong> anywhere — SCP, identity policy, resource policy, boundary? If yes, done. Deny always wins.</li><li>If the account is in an organisation, do the <strong>SCPs allow</strong> the action? SCPs never grant, they only bound.</li><li>Does the <strong>permissions boundary</strong>, if attached, allow it?</li><li>Does any <strong>session policy</strong> allow it?</li><li>Finally, is there an explicit <strong>Allow</strong> in an identity policy or a resource policy?</li></ol><p>All of the applicable layers must permit; any one of them denying is fatal. The mental model I hold is that every layer is a filter, not a grant, except the last one.</p>"},
{lvl:"core",q:"Team A's Lambda must read a bucket in Team B's account. Set it up.",a:"<p>Two sides, and both are required.</p><p>In Team B, the <strong>bucket policy</strong> allows the Lambda's execution role ARN to perform <code>s3:GetObject</code> on the specific prefix — and if the objects are encrypted with a customer-managed KMS key, the <strong>key policy</strong> must also allow that principal to <code>kms:Decrypt</code>. That KMS step is the one people miss, and it produces an access-denied error that points at S3.</p><p>In Team A, the Lambda's execution role needs <code>s3:GetObject</code> on the same ARN. A resource policy in another account does not remove the need for the caller's own account to permit the call.</p><p>I would scope it with a condition on <code>aws:PrincipalOrgID</code> so it cannot be widened to arbitrary accounts later, and prefer the direct resource-policy route over role assumption for a single read path — assuming a role adds an STS hop for no benefit here.</p>"},
{lvl:"core",q:"What is a permissions boundary and when have you needed one?",a:"<p>A boundary is a maximum. Attached to a role or user, the effective permissions become the intersection of the identity policy and the boundary — the boundary never grants anything by itself.</p><p>The use case is delegation. You want application teams to create their own roles for their own services, without needing a platform engineer in the loop, but you cannot let them create a role with <code>AdministratorAccess</code>. So you grant <code>iam:CreateRole</code> with a condition requiring that a specific boundary policy is attached. Now they have autonomy inside a ceiling you control.</p><p>The contrast worth drawing: an SCP bounds an entire account, a boundary bounds one identity. They serve the same idea at different granularity.</p>"},
{lvl:"senior",q:"How do you get from a permissive account to least privilege without breaking production?",a:"<p>Measure before cutting. IAM <strong>Access Analyzer</strong> generates policies from CloudTrail history, so I would start by collecting 30 to 90 days of actual usage per role and diffing that against what is granted. That converts a debate into data.</p><p>Then roll out in stages. New roles get tight policies from day one, which stops the problem growing. Existing roles get the generated policy applied in a lower environment first, then in production with CloudTrail alarms on access-denied events, so a missed permission surfaces as an alert rather than an incident. <code>Last accessed</code> data identifies whole services never used by a role — removing those is nearly risk-free and often removes most of the surplus.</p><p>Underneath, SCPs give guardrails that do not require touching every role: deny actions outside approved regions, deny disabling CloudTrail or GuardDuty, deny public S3 access. Those are broad wins that do not depend on per-role analysis.</p><p>The judgement call I would state: never do this as a big-bang change. Least privilege applied all at once to a running system produces an outage and, worse, a culture that reverses the whole effort.</p>"}
]},

{
id:"vpc", name:"Amazon VPC", domain:"Networking", tier:1,
tagline:"Your own network. Subnets, routing, and two different firewalls people constantly confuse.",
hook:"<b>Public subnet</b> means one thing only: its route table has a route to an internet gateway. Nothing else about it is different.",
model:"A VPC is a CIDR block split into subnets, each in one AZ. Route tables decide where traffic goes. An internet gateway makes a subnet public; a NAT gateway lets private subnets reach out without being reachable. Security groups and network ACLs are the two filtering layers, and their difference is a guaranteed question.",
facts:[
"<strong>Security groups are stateful</strong>: allow a request in and the response is automatically allowed out. They only have allow rules, and they attach to ENIs.",
"<strong>NACLs are stateless</strong>: they evaluate rules in number order, support explicit deny, and apply at the subnet boundary. Return traffic needs its own rule — which is why ephemeral port ranges matter.",
"A security group can reference <em>another security group</em> as its source. That is the idiomatic way to say 'the app tier may reach the database tier' without hard-coding IPs.",
"<strong>Gateway endpoints</strong> (S3, DynamoDB) are free and work by route table entry. <strong>Interface endpoints</strong> (PrivateLink) create an ENI in your subnet and bill hourly plus data.",
"VPC peering is not transitive and does not support overlapping CIDRs. Transit Gateway is the hub for anything beyond a handful of VPCs."
],
numbers:[["Subnet","one AZ, cannot span"],["Reserved IPs per subnet","5"],["Security group","stateful, allow only"],["NACL","stateless, ordered, allow + deny"],["NAT gateway","per-AZ for HA, hourly + per-GB"],["Peering","non-transitive, no overlapping CIDRs"]],
pick:{use:["Any workload needing network isolation","Private subnets for databases and internal services","VPC endpoints to keep AWS API traffic off the internet","Transit Gateway once VPC count passes a handful"],avoid:["Over-segmenting into dozens of tiny subnets you then run out of IPs in","One NAT gateway for a multi-AZ workload — it is a single point of failure and a cross-AZ cost","Public subnets for anything that does not need inbound internet"]},
gotchas:[
"NAT gateway data processing charges are one of the top surprise line items. Traffic to S3 through NAT should be going through a free gateway endpoint instead.",
"A single NAT gateway serving three AZs means cross-AZ transfer charges and an AZ-failure blast radius. One per AZ.",
"CIDR sizing is effectively permanent for planning purposes — EKS pods consuming VPC IPs is what usually exposes an undersized VPC.",
"Security groups cannot deny. If you need to block a specific IP, that is a NACL or WAF.",
"NACL rules are evaluated lowest number first and stop at the first match, so a broad allow at rule 100 makes a deny at rule 200 dead.",
"Overlapping CIDRs across VPCs is a permanent obstacle to peering — plan address space centrally."
],
qs:[
{lvl:"screen",q:"Security group versus NACL.",a:"<p>Security groups are stateful and attach to an ENI — so to the instance or task. Allow the inbound request and the response leaves automatically, and there are no deny rules; anything not allowed is denied.</p><p>NACLs are stateless and attach to the subnet. They evaluate numbered rules in order, support both allow and deny, and require an explicit rule for return traffic — which is why NACLs need ephemeral port ranges open outbound.</p><p>Practically: security groups do almost all the work, and NACLs are a coarse subnet-level backstop, most useful for blocking a specific IP range, which security groups cannot express.</p>"},
{lvl:"core",q:"A private-subnet instance cannot reach S3. Debug it.",a:"<p>I would work outward from the instance.</p><ul><li><strong>Route</strong>: does the subnet's route table have a path to S3 — either <code>0.0.0.0/0</code> to a NAT gateway, or better, a gateway endpoint prefix list entry?</li><li><strong>Security group egress</strong>: default allows all outbound, but a hardened one may not permit 443.</li><li><strong>NACL</strong>: outbound 443 allowed <em>and</em> inbound ephemeral ports allowed, since it is stateless.</li><li><strong>Endpoint policy</strong>: gateway endpoints carry their own policy, and a restrictive one blocks buckets that IAM would otherwise permit.</li><li><strong>IAM</strong>: the instance role's permissions, and the bucket policy — which may require access via a specific endpoint or VPC.</li></ul><p>The fastest discriminator is whether it is timing out or being refused. A timeout points at routing or NACLs; an access-denied response means the network is fine and it is a policy problem.</p><p>And the recommendation I would make regardless: use a gateway endpoint. It is free, keeps the traffic off the internet, and removes the NAT data charge.</p>"},
{lvl:"senior",q:"Design the network for a three-tier application across three AZs.",a:"<p>One VPC with a CIDR sized generously — I would rather waste address space than re-address later, especially if EKS is involved and pods take VPC IPs.</p><p>Three subnet tiers, one per AZ, so nine subnets. <strong>Public</strong> holds only the load balancers and the NAT gateways. <strong>Private application</strong> holds ECS tasks or nodes. <strong>Private data</strong> holds RDS and ElastiCache, with no route to a NAT at all — it does not need outbound internet, so it should not have it.</p><p>Security groups chained by reference rather than by CIDR: ALB security group allows 443 from the internet; app security group allows its port from the ALB security group; database security group allows 5432 from the app security group. Nobody writes an IP.</p><p>One NAT gateway per AZ so an AZ failure does not take out egress for the others, and so traffic stays in-zone. Gateway endpoints for S3 and DynamoDB, interface endpoints for the APIs used heavily — Secrets Manager, ECR, CloudWatch Logs — which cuts NAT data charges and keeps traffic private.</p><p>The trade-off I would flag: three NAT gateways cost meaningfully more than one, and for a non-production environment I would deliberately run a single NAT and accept the blast radius.</p>"}
]},

{
id:"elb", name:"Elastic Load Balancing", domain:"Networking", tier:2,
tagline:"ALB for HTTP, NLB for raw TCP performance and static IPs.",
hook:"<b>ALB reads your request. NLB does not.</b> That single difference explains every other difference between them.",
model:"ALB operates at layer 7: it terminates HTTP, routes on host, path, header or method, and can authenticate. NLB operates at layer 4: it forwards TCP/UDP with very low latency, preserves the client IP, offers static and Elastic IPs, and scales to extreme connection rates. Gateway Load Balancer is a third case for inserting inline security appliances.",
facts:[
"ALB features that matter in interviews: path and host routing, target groups with weighted routing for canaries, WebSocket and gRPC support, and native OIDC/Cognito authentication.",
"NLB gives a static IP per AZ, which is what you need when a client's firewall allowlists IPs.",
"Health checks drive everything — a target failing health checks is removed, and misconfigured checks cause the classic flapping deploy.",
"<strong>Deregistration delay</strong> (connection draining) governs graceful shutdown; too short and in-flight requests are cut.",
"Cross-zone load balancing is on by default for ALB and off by default for NLB, which produces surprising imbalance."
],
numbers:[["ALB","layer 7, HTTP/HTTPS/gRPC"],["NLB","layer 4, TCP/UDP, static IP"],["ALB idle timeout","60 s default"],["Deregistration delay","300 s default"],["Health check","interval, threshold, path"]],
pick:{use:["ALB: microservices behind one hostname, canaries, header-based routing","NLB: extreme throughput, static IPs, non-HTTP protocols, TLS passthrough","GWLB: inline third-party firewall or IDS appliances"],avoid:["ALB for non-HTTP traffic","NLB when you need content-based routing","A load balancer per service when one ALB with rules would do"]},
gotchas:[
"Backend idle timeout shorter than the ALB's causes intermittent 502s from reused connections.",
"NLB preserves client IP, so backend security groups must allow the client range, not the load balancer.",
"NLB cross-zone off by default means an AZ with fewer targets gets the same share of traffic.",
"ALB access logs are off by default, and you will want them the first time you debug a 5xx."
],
qs:[
{lvl:"core",q:"You see intermittent 502s from your ALB. Where do you look?",a:"<p>502 means the ALB reached the target but did not get a valid response, so it is nearly always the connection or the target lifecycle rather than routing.</p><p>My first suspicion is an <strong>idle timeout mismatch</strong>: if the application's keep-alive timeout is shorter than the ALB's 60 seconds, the ALB reuses a connection the app has just closed and the request fails. The fix is to make the backend timeout comfortably longer than the ALB's.</p><p>Second, <strong>deployment lifecycle</strong>: targets being deregistered while still receiving traffic, or new targets passing health checks before they can actually serve. That needs a longer deregistration delay than the longest request, and a real readiness check.</p><p>Third, the target crashing or being OOM-killed mid-response, which shows up in the container logs but not in the load balancer's.</p><p>ALB access logs with the <code>target_status_code</code> and processing-time fields separate these three quickly — that is where I would go first if the logs are enabled.</p>"}
]},

{
id:"cloudfront", name:"Amazon CloudFront", domain:"Networking", tier:2,
tagline:"CDN at the edge — caching, TLS termination, and a place to run tiny logic.",
hook:"CloudFront is not just caching. It is also the <b>security perimeter</b>: TLS, WAF, and the only public door to a private origin.",
model:"Requests hit an edge location, which serves from cache or fetches from the origin. What gets cached is determined by the cache key — path plus whichever headers, cookies and query strings you include. Origin Access Control locks an S3 origin so it is only reachable through the distribution.",
facts:[
"The <strong>cache key</strong> is the whole game. Including a cookie or a <code>Cache-Control: no-store</code> header that varies per user drops the hit rate to zero.",
"<strong>CloudFront Functions</strong> run lightweight JavaScript at the edge for header manipulation and redirects; <strong>Lambda@Edge</strong> runs heavier logic at regional edges with more runtime freedom.",
"Signed URLs and signed cookies give time-bounded private access to content.",
"Invalidation is slow and rate-limited — versioned object keys are the better pattern for cache busting.",
"Origin failover with an origin group gives static-site resilience across regions."
],
numbers:[["Cache key","path + selected headers/cookies/query"],["Invalidation","slow, first 1,000 paths/month free"],["Edge compute","CloudFront Functions or Lambda@Edge"],["Origin protection","Origin Access Control"]],
pick:{use:["Static assets and media at global scale","Fronting an API for TLS termination, WAF and DDoS absorption","Private S3 content with signed URLs","Reducing origin load and egress cost"],avoid:["Fully personalised uncacheable responses — you gain little beyond TLS offload","Internal-only services","When latency is dominated by a slow origin, not distance"]},
gotchas:[
"Forwarding all headers and cookies destroys the hit rate — this is the most common CDN misconfiguration.",
"Invalidations are not instant; deploys that rely on them get stale-content bug reports.",
"Origin errors get cached too — a 5xx with a long TTL propagates an outage.",
"Making the S3 bucket public instead of using Origin Access Control leaves a bypass route around WAF and signed URLs."
],
qs:[
{lvl:"senior",q:"Cache hit rate is 40% on a mostly static site. Improve it.",a:"<p>40% on static content means the cache key is too specific, so I would look at the cache policy first.</p><p>Typical culprits: forwarding all query strings, so an analytics parameter like <code>?utm_source=</code> creates a separate cache entry per campaign; forwarding all cookies, which makes every logged-in user unique; and origins sending <code>Cache-Control: no-cache</code> or omitting it entirely so CloudFront falls back to a short default.</p><p>The fixes: restrict the cache key to the query parameters that actually change the response, strip cookies for static paths, and set explicit long <code>max-age</code> on immutable assets with hashed filenames so they never need invalidating. Separate behaviours for <code>/static/*</code> and <code>/api/*</code> so each gets an appropriate policy.</p><p>I would measure with the cache statistics report and the <code>x-cache</code> response header before and after, and I would also check whether the misses are concentrated on a few paths — sometimes it is one uncacheable endpoint dominating the request count rather than a general policy problem.</p>"}
]},

{
id:"route53", name:"Amazon Route 53", domain:"Networking", tier:3,
tagline:"DNS with health checks and routing policies that make it a traffic manager.",
hook:"Route 53 is where <b>failover and multi-region routing</b> actually get decided.",
model:"Authoritative DNS with hosted zones. Routing policies determine which record is returned: simple, weighted, latency-based, failover, geolocation, geoproximity or multivalue. Health checks feed failover automatically.",
facts:[
"<strong>Alias records</strong> point at AWS resources like ALBs and CloudFront, resolve at the zone apex (unlike CNAME), and are free to query.",
"Weighted routing is how you do canary and blue-green at the DNS layer.",
"Latency-based routing sends users to the lowest-latency region, which is not always the nearest geographically.",
"Private hosted zones resolve only inside associated VPCs.",
"TTL is the recovery-time floor for DNS-based failover — clients cache."
],
numbers:[["Policies","simple, weighted, latency, failover, geo, multivalue"],["Alias","free queries, works at zone apex"],["Health checks","drive automatic failover"],["TTL","bounds failover speed"]],
pick:{use:["Multi-region active-passive failover","Gradual traffic shifting by weight","Latency-optimised global routing","Internal service naming with private zones"],avoid:["Fast failover with long TTLs — DNS is not a load balancer","Fine-grained per-request routing"]},
gotchas:[
"Clients and resolvers ignore short TTLs more often than you expect, so DNS failover is minutes, not seconds.",
"Health checks must probe something meaningful — a static page that stays up during a database outage is useless.",
"Deleting a record used by an alias elsewhere breaks resolution silently."
],
qs:[
{lvl:"core",q:"Design multi-region failover for a web application.",a:"<p>Route 53 <strong>failover routing</strong> with health checks: primary record pointing at the active region's ALB, secondary at the standby, and a health check that exercises a real dependency path, not just a static page.</p><p>The parts that actually determine whether this works are below DNS. Data replication decides your RPO — Aurora Global Database or DynamoDB global tables give seconds; snapshot copies give hours. Standby capacity decides your RTO — pilot light means scaling up under pressure, warm standby costs more but recovers faster.</p><p>And I would set a short TTL, while being honest that DNS failover is minutes at best because resolvers cache. If the requirement is seconds, this is the wrong mechanism and we should be talking about active-active with a global accelerator.</p><p>Finally: an untested failover is not a failover. It needs a scheduled game day, because the failures are always in the parts nobody rehearsed — DNS is usually the part that works.</p>"}
]},

{
id:"kms", name:"AWS KMS", domain:"Security", tier:2,
tagline:"Managed key custody with envelope encryption and an audit trail.",
hook:"KMS does not encrypt your data. It encrypts <b>the key that encrypts your data</b>.",
model:"Envelope encryption: your application asks KMS for a data key, gets it in plaintext and encrypted form, encrypts locally with the plaintext key, discards it, and stores the encrypted key alongside the ciphertext. To decrypt, send the encrypted key back to KMS. This keeps large payloads out of KMS and makes key rotation and revocation tractable.",
facts:[
"<strong>Key policies are mandatory</strong> and primary. An IAM policy granting KMS access does nothing unless the key policy delegates to IAM in that account — this is the number-one cross-account KMS failure.",
"AWS-managed keys are free but not shareable across accounts and rotate on AWS's schedule; customer-managed keys cost per month and per request but give you policy, rotation and grant control.",
"Automatic annual rotation keeps old key material so existing ciphertext stays decryptable — rotation does not re-encrypt anything.",
"<strong>Grants</strong> give temporary, narrowly-scoped permissions, which is how AWS services get access on your behalf.",
"Encryption context is additional authenticated data — it must match on decrypt, and it appears in CloudTrail, which makes it useful for audit and for binding ciphertext to a purpose."
],
numbers:[["Pattern","envelope encryption via GenerateDataKey"],["Key policy","required; IAM alone is not enough"],["Rotation","annual, old material retained"],["Direct encrypt limit","4 KB"],["Audit","every call in CloudTrail"]],
pick:{use:["Encrypting data keys for application-level field encryption","Enforcing encryption at rest on S3, EBS, RDS, DynamoDB","Cross-account data sharing with controlled key access","Auditable, revocable key custody"],avoid:["Encrypting large payloads directly — that is what data keys are for","One key for everything, which makes revocation all-or-nothing","Customer-managed keys where an AWS-managed key is sufficient"]},
gotchas:[
"A key policy without <code>kms:*</code> delegation to the account root locks everyone out, including you, and it is not recoverable.",
"Rotation does not re-encrypt existing data; ciphertext still references the old key version.",
"KMS request throttling under a burst of decrypt calls is real — cache data keys in memory rather than calling per record.",
"Deleting a key requires a waiting period, and after deletion the ciphertext is unrecoverable. That is the design.",
"Cross-region use needs multi-region keys or re-encryption; a key is regional."
],
qs:[
{lvl:"core",q:"Explain envelope encryption and why it exists.",a:"<p>KMS will only encrypt about 4 KB directly, and even if it did more, sending every payload to a network service would be slow and expensive. So instead you encrypt the key.</p><p>The flow: call <code>GenerateDataKey</code> and get back the same key twice — once in plaintext, once encrypted under the KMS key. Encrypt the data locally with the plaintext key, then wipe it from memory. Store the encrypted data key next to the ciphertext.</p><p>To decrypt, send the encrypted data key to KMS, get the plaintext back, decrypt locally. KMS only ever handles small keys, the bulk crypto is local and fast, and access is revoked centrally by changing the key policy — because without KMS the stored data key is useless.</p><p>I have used exactly this for field-level PII encryption, where the added wrinkle was caching data keys with a short lifetime to avoid a KMS call per record while keeping the blast radius small.</p>"},
{lvl:"senior",q:"How would you rotate encryption for a field-level encrypted database from AES-128 to AES-256?",a:"<p>The requirement is a migration with no read downtime, so the system must be able to read both formats while only writing the new one.</p><p>I would <strong>version the ciphertext</strong>: store an algorithm and key-version marker alongside each encrypted value. The read path dispatches on that marker, so old and new records coexist indefinitely. The write path always produces the new version. That alone makes the system correct before any data has moved.</p><p>Then a background migration job walks the data in batches, decrypting with the old key and re-encrypting with the new — idempotent, restartable, rate-limited so it does not saturate KMS or the database, and checkpointed so a restart resumes rather than rescans. Because writes may happen concurrently, each record update is conditional on the version it read, so the job never overwrites a newer write.</p><p>Two extras worth mentioning: if any field is searchable, deterministic encryption or an HMAC-based blind index needs migrating in step with it, which usually means maintaining both indexes during the transition. And the cutover is not when the job finishes — it is when a query confirms zero records remain at the old version, after which the old key can be scheduled for deletion.</p>"}
]},

{

{
id:"cloudwatch", name:"CloudWatch & X-Ray", domain:"Operations", tier:2,
tagline:"Metrics, logs, traces and alarms — and a bill that grows quietly.",
hook:"The interview question is never 'what is CloudWatch'. It is <b>what would you alarm on</b>.",
model:"CloudWatch collects metrics (AWS-published and custom), logs, and alarms that act on them. Logs Insights queries log data on demand. X-Ray adds distributed tracing across services, producing a service map and per-segment latency. Together they answer what broke, where, and how far the effect spread.",
facts:[
"<strong>Embedded Metric Format</strong> lets you emit structured logs that CloudWatch parses into metrics — one write instead of a log line plus a <code>PutMetricData</code> call.",
"<strong>Composite alarms</strong> combine conditions, which is how you stop a deploy from firing forty pages at once.",
"Metric filters turn log patterns into metrics, useful for counting errors in logs from services that publish no metric.",
"X-Ray sampling is configurable — tracing every request at high volume is expensive and rarely necessary.",
"Alarms should mostly be on symptoms users feel (latency, error rate, queue age), with cause metrics available for the investigation rather than paging."
],
numbers:[["Standard metric resolution","1 minute"],["High-resolution custom","1 second"],["Alarm states","OK / ALARM / INSUFFICIENT_DATA"],["Logs billing","ingestion + storage + queries"],["Retention","never expires unless you set it"]],
pick:{use:["Alarms on user-facing symptoms with actionable runbooks","Logs Insights for incident investigation","X-Ray to find which hop in a chain is slow","EMF for high-cardinality application metrics"],avoid:["Alarming on every metric — alert fatigue is the failure mode","Debug logging in production at volume — ingestion cost is real","Tracing 100% of requests at high throughput"]},
gotchas:[
"Log groups default to never expiring. Setting retention is the single easiest CloudWatch cost fix.",
"<code>INSUFFICIENT_DATA</code> is not OK — an alarm on a metric that stops being published goes quiet instead of firing. Treat missing data as breaching where it matters.",
"Custom metrics are billed per metric per month, and high-cardinality dimensions multiply that fast.",
"Cross-account and cross-region dashboards need explicit setup; teams discover this mid-incident."
],
qs:[
{lvl:"senior",q:"What would you alarm on for a queue-backed order service?",a:"<p>I would alarm on things a customer would notice, and keep everything else as a dashboard.</p><ul><li><strong>Age of oldest message</strong> on the queue — the single best indicator that processing has stalled. Queue depth alone hides a slow consumer that keeps up with a growing backlog.</li><li><strong>Error rate</strong> as a proportion of requests, not an absolute count, so it means the same thing at 10 rps and 1,000 rps.</li><li><strong>p99 latency</strong> against the stated SLO.</li><li><strong>DLQ message count above zero</strong> — anything landing there needs a human.</li><li><strong>Business heartbeat</strong>: orders completed per five minutes falling below a floor. This catches the failures where every technical metric is green and nothing is actually working.</li></ul><p>Each of those gets a runbook link in the alarm description. Anything without a runbook is a dashboard metric, not a page — otherwise you train the on-call to ignore alarms, which is worse than not having them.</p>"}
]},

{
id:"cloudtrail", name:"CloudTrail, Config & Systems Manager", domain:"Operations", tier:3,
tagline:"Who did what, whether resources drifted, and how you touch instances without SSH.",
hook:"CloudTrail answers <b>who called the API</b>. Config answers <b>what the resource looked like over time</b>.",
model:"CloudTrail records API calls — management events by default, data events (S3 object-level, Lambda invocations) if you enable and pay for them. Config records resource configuration snapshots and evaluates them against rules, with a timeline. Systems Manager provides Session Manager, Run Command, Patch Manager and Parameter Store.",

],
numbers:[["CloudTrail history","90 days free in console"],["Management events","logged by default"],["Data events","opt-in, billed"],["Config","configuration timeline + rules"],["Session Manager","no inbound port, IAM-controlled"]],
pick:{use:["Organisation trail to a central account for audit","Config rules for compliance guardrails with remediation","Session Manager instead of bastion hosts","Patch Manager for fleet patching"],avoid:["Enabling data events everywhere without checking cost","Relying on the 90-day console history as your audit record"]},
gotchas:[

],
qs:[
{lvl:"core",q:"Someone deleted a production bucket. How do you find out who?",a:"<p>CloudTrail. The <code>DeleteBucket</code> call is a management event, logged by default, and the record carries the identity, source IP, user agent and time. If the account is in an organisation with a centralised trail, I would query it through CloudTrail Lake or Athena over the S3 trail data rather than the console, which only shows 90 days.</p><p>The follow-up that matters more: how do we stop it recurring? An SCP denying <code>s3:DeleteBucket</code> outside a break-glass role, MFA-delete on critical buckets, and versioning with a bucket policy preventing version deletion. Detection is the postmortem; the prevention is the actual answer.</p>"}
]},

{
id:"iac", name:"CloudFormation, CDK & Organizations", domain:"Operations", tier:2,
tagline:"Infrastructure as code, and the account structure it deploys into.",
hook:"The senior signal is not knowing the syntax. It is <b>how you structure state and blast radius</b>.",
model:"CloudFormation is the declarative engine: templates create stacks, change sets preview diffs, drift detection finds manual edits, StackSets deploy across accounts and regions. CDK is a programming-language layer that synthesises CloudFormation. Organizations provides multi-account structure with SCP guardrails, which is where isolation actually comes from.",
facts:[
"<strong>Multi-account is the real isolation boundary.</strong> Separate accounts per environment limit blast radius, simplify cost attribution and make SCPs meaningful — far more effective than IAM segmentation within one account.",
"Change sets show what will happen before it happens, which is what makes CloudFormation deploys reviewable.",
"<code>DeletionPolicy: Retain</code> on stateful resources prevents a stack deletion from taking a database with it.",
"CDK gives loops, conditionals and reusable constructs, but the deployed artefact is still CloudFormation with all its limits.",

],
numbers:[["CloudFormation","stacks, change sets, drift detection"],["StackSets","multi-account, multi-region"],["CDK","synthesises to CloudFormation"],["SCPs","bound accounts, never grant"]],
pick:{use:["Any infrastructure that must be reproducible","Separate accounts per environment under Organizations","SCP guardrails on region, encryption and logging","StackSets for baseline configuration everywhere"],avoid:["One giant stack containing everything — deploys become high-risk","Manual console changes on managed resources","Mixing stateful and stateless resources in the same stack"]},
gotchas:[
"A rollback failure leaves a stack in a state that needs manual intervention — one reason to keep stacks small.",
"Deleting a stack deletes its resources, including databases, unless retention is set.",
"Drift from console edits makes the next deploy behave unexpectedly.",
"Circular dependencies between stacks are painful to unwind; use exports and imports deliberately."
],
qs:[
{lvl:"senior",q:"How do you structure accounts and stacks for a company with 30 services?",a:"<p>Accounts first, because that is the boundary that actually contains failure. At minimum: separate production, staging and development accounts, plus a shared security account for centralised CloudTrail and GuardDuty findings, and a shared services account for CI and the container registry. Organizations on top, with SCPs enforcing the non-negotiables — approved regions only, no disabling CloudTrail, encryption required.</p><p>Stacks within an account get split by <strong>lifecycle and ownership</strong>, not by service. Network and shared infrastructure change rarely and belong in their own stack. Stateful resources — databases, buckets — go in a stack separate from the application, with retention policies, so redeploying an application can never destroy data. Application stacks are per-service and small enough that a failed rollback affects one team.</p><p>The pattern I would avoid is the monolithic template. It makes every deploy a company-wide risk and eventually someone starts making console changes to avoid running it, which is how drift begins.</p>"}
]},

{
id:"cognito-waf", name:"Cognito, WAF, Shield & GuardDuty", domain:"Security", tier:3,
tagline:"User identity, request filtering, DDoS protection and threat detection.",
hook:"Know which layer each one sits at: <b>Cognito is identity, WAF filters requests, Shield absorbs volume, GuardDuty watches behaviour.</b>",
model:"Cognito user pools authenticate end users and issue JWTs; identity pools exchange an identity for temporary AWS credentials. WAF applies rule-based filtering at CloudFront, ALB or API Gateway. Shield Standard is automatic; Advanced adds response support and cost protection. GuardDuty analyses CloudTrail, VPC flow logs and DNS logs for anomalous behaviour.",
facts:[
"User pool versus identity pool is a standard question: authentication versus AWS credential vending. Many applications need only the first.",
"WAF managed rule groups cover the common cases quickly; rate-based rules stop simple floods.",
"GuardDuty needs no agents — it reads logs AWS already has, which is why it is usually the first detection control enabled.",
"Security Hub aggregates findings across GuardDuty, Inspector, Macie and Config into one view."
],
numbers:[["Cognito user pool","authN, issues JWTs"],["Cognito identity pool","AWS temporary credentials"],["WAF","attaches to CloudFront, ALB, API Gateway"],["Shield Standard","automatic, no cost"],["GuardDuty","agentless, log-based detection"]],
pick:{use:["Cognito when you do not want to own password storage and MFA","WAF for injection, bad bots and rate limiting at the edge","GuardDuty as a baseline detection control in every account"],avoid:["Cognito for complex enterprise identity federation without evaluating alternatives","WAF as a substitute for input validation in the application"]},
gotchas:[
"Cognito user pool customisation is limited; teams hit walls on unusual flows.",
"WAF rules in count mode do nothing — a surprising number of deployments never switch to block.",
"GuardDuty findings need routing to somewhere a human looks, or they accumulate unseen."
],
qs:[
{lvl:"core",q:"Your login endpoint is being credential-stuffed. Respond.",a:"<p>Immediate: a WAF <strong>rate-based rule</strong> on the login path keyed by IP, plus the managed IP reputation and bot control rule groups, to blunt the volume. That buys time without a deploy.</p><p>Then the application-layer controls, which are what actually fix it: account lockout with exponential backoff keyed on the account rather than the IP, since distributed attacks rotate IPs; a CAPTCHA challenge after a few failures; and MFA on the account, which makes stolen credentials insufficient by themselves.</p><p>Longer term I would check breached-password lists at registration and password change, and alarm on the ratio of failed to successful logins, because the metric that catches the next attack is the shape of the traffic, not the individual requests.</p>"}
]}
);

const GUIDES = [
{id:"start", title:"How to use this book", nav:"Start here", html:`
<p class="lede">A working manual for AWS rounds at senior and lead level. It is organised the way interviews actually run: a trade-off, a scenario, a failure to debug, a bill to reduce.</p>
<h2>What is actually being tested</h2>
<p>By the senior bar, nobody is checking whether you can define S3. They are checking three things, and every question is a proxy for one of them.</p>
<div class="stack">
<div><b>Do you choose with reasons?</b><p>Anyone can name a service. The signal is whether you name the variable that decided it — duration, ordering, consumer count, query pattern — and whether you can say what would change your mind.</p></div>
<div><b>Do you know how it fails?</b><p>Engineers who have run something in production talk about visibility timeouts, hot partitions, replica lag and cold starts unprompted. Engineers who have read about it talk about features.</p></div>
<div><b>Do you know what it costs?</b><p>Cost awareness reads as ownership. NAT gateway data processing, idle EMR clusters, forgotten SageMaker endpoints, CloudWatch log retention — these are the details that mark someone who has held a budget.</p></div>
</div>
<h2>Three frameworks worth memorising</h2>
<h3>Comparison questions: pick, because, unless</h3>
<p>One sentence naming the choice, two reasons, one condition that would reverse it. It takes twenty seconds and it demonstrates judgement rather than recall.</p>
<div class="hook"><b>Example</b>SQS, because the work must survive a consumer restart and only one worker should handle each order — unless another team needs the same events, in which case SNS in front with a queue per consumer.</div>
<h3>Design questions: five lenses</h3>
<p>Walk them in order and you will not forget a dimension under pressure.</p>
<ol><li><b>Traffic</b> — volume, shape, spiky or steady, read/write ratio</li><li><b>Data</b> — access patterns, size, retention, consistency needs</li><li><b>Failure</b> — what breaks, blast radius, what the user sees</li><li><b>Security</b> — identity, encryption, network boundary</li><li><b>Bill</b> — the dominant cost line, and the one lever that moves it</li></ol>
<h3>Debug questions: narrow before you fix</h3>
<p>Say what you would measure before you say what you would change. Reaching for a fix immediately is the most common way strong engineers sound junior.</p>
<div class="hook"><b>Order</b>Reproduce → find the layer (network, IAM, application, downstream) → check limits and quotas → check identity → check idempotency → only then propose a change.</div>
<h2>Reading order</h2>
<p>If you have a fortnight, do this in order: <a href="#/svc/iam">IAM</a>, <a href="#/svc/s3">S3</a>, <a href="#/svc/dynamodb">DynamoDB</a>, <a href="#/svc/sqs">SQS</a>, <a href="#/svc/vpc">VPC</a>, <a href="#/svc/lambda">Lambda</a>, then the compute trio. Those seven carry most of the question volume in most interviews. Everything else is depth for the round where they push.</p>
<p>Mark each service <span class="tag">solid</span> or <span class="tag">shaky</span> as you go — the contents rail keeps the score, and <a href="#/cards">Cards</a> and <a href="#/quiz">Quiz</a> pull from what you have marked shaky.</p>
`},
{id:"companies", title:"What each kind of company is testing", nav:"By company type", html:`
<p class="lede">The same service, asked four different ways. Recognising which conversation you are in changes what a good answer looks like.</p>
<h2>Large product companies</h2>
<p>Amazon, Google, Microsoft, and the Indian product tier — Flipkart, Swiggy, Zomato, Razorpay, PhonePe, Meesho.</p>
<p>The bar is <b>depth over breadth</b>. They will pick one service and push until you reach the edge of your knowledge, and reaching that edge is fine — pretending you have not is not. Expect scale arithmetic out loud, explicit failure analysis, and repeated "why not X" challenges that are testing whether your reasoning survives pressure or collapses into agreement.</p>
<p>At Amazon specifically, every round carries Leadership Principles weight and one interviewer is a Bar Raiser from outside the team. Technical answers still need <b>ownership language</b>: what you decided, what you owned, what the measurable result was.</p>
<div class="hook"><b>What lands</b>Numbers. "At 2,000 writes per second with a 1 KB item, that is 2,000 WCU, which needs at least two partitions and a partition key with real cardinality." Specificity is the whole signal.</div>
<h2>Startups, seed to Series C</h2>
<p>The question behind every question is <b>can you own the entire account</b>. There is no platform team. You will be asked what you would do first, and the right answer is usually unglamorous: get IaC in, get the bill visible, get alarms on the two things that page.</p>
<p>They value pragmatism over correctness. Recommending EKS with a service mesh for a team of five reads as a red flag, not sophistication. Recommending ECS on Fargate with one ALB and a managed Postgres, and explaining why you deliberately did not reach for more, reads as senior.</p>
<div class="hook"><b>What lands</b>"I would run it on Fargate behind an ALB with RDS, put everything in CDK, and set a billing alarm on day one. When we outgrow it I will know, because I will be watching queue age and database CPU."</div>
<h2>Enterprise and services organisations</h2>
<p>Consultancies, GCCs, and enterprise IT. Breadth matters more here, and so does the vocabulary: <b>Well-Architected Framework</b> pillars, landing zones, migration strategies (rehost, replatform, refactor), governance, tagging, chargeback.</p>
<p>Expect questions about multi-account structure, compliance controls, and how you would migrate something legacy rather than design something new. Certification-shaped knowledge is genuinely useful in this setting in a way it is not at a product company.</p>
<h2>Data and ML roles</h2>
<p>The centre of gravity moves to S3 layout, file formats, partitioning, Spark behaviour, and cost per terabyte. Expect to be asked why a job got slower, how you would cut an Athena bill, and how you would keep a training pipeline reproducible.</p>
<p>The differentiator at senior level is treating pipelines as production systems: idempotency, backfills, schema evolution, data quality checks, and what happens when yesterday's partition arrives late.</p>
<h2>The question types, and what each one wants</h2>
<table class="plan"><tr><th>They ask</th><th>They are checking</th><th>Answer shape</th></tr>
<tr><td>Difference between A and B</td><td>Mental model clarity</td><td>One deciding variable, then the detail</td></tr>
<tr><td>Which would you choose</td><td>Judgement under constraints</td><td>Pick, because, unless</td></tr>
<tr><td>This is broken, why</td><td>Production experience</td><td>Measure first, then narrow, then fix</td></tr>
<tr><td>The bill went up</td><td>Ownership</td><td>Find the driver with data, then the lever</td></tr>
<tr><td>Design X</td><td>Structured thinking</td><td>Five lenses, out loud, with trade-offs named</td></tr>
<tr><td>How does it scale</td><td>Knowing the limits</td><td>Name the first thing that breaks and at what number</td></tr>
<tr><td>Tell me about a time</td><td>Ownership and reflection</td><td>Situation, your decision, result, what you would change</td></tr></table>
<h2>What reads as senior, and what does not</h2>
<div class="pick">
<div><h5>Signals seniority</h5><ul>
<li>Naming the trade-off before the choice</li>
<li>Volunteering the failure mode unprompted</li>
<li>Saying "I do not know, here is how I would find out"</li>
<li>Asking about scale and consistency before designing</li>
<li>Bringing up cost without being asked</li>
<li>Pushing back on a bad requirement, politely</li>
</ul></div>
<div><h5>Reads as junior</h5><ul>
<li>Listing features instead of choosing</li>
<li>Reaching for Kubernetes by default</li>
<li>Never mentioning what could go wrong</li>
<li>Designing before asking what the load is</li>
<li>Agreeing instantly when challenged</li>
<li>Claiming certainty about limits you half-remember</li>
</ul></div>
</div>
`},
{id:"designs", title:"System design playbooks", nav:"Design playbooks", html:`
<p class="lede">Six designs that cover most of what gets asked. Each one is written as the walkthrough, not the diagram — the reasoning is the deliverable.</p>

<h2>1. URL shortener at 10,000 reads per second</h2>
<p><b>Clarify first.</b> Read/write ratio (typically 100:1 or worse), whether short codes must be unguessable, custom aliases, expiry, and whether click analytics are required. The analytics answer changes the design more than the traffic number does.</p>
<p><b>Shape.</b> Writes are trivial; reads dominate and are pure key lookups. That is DynamoDB, not a relational database — the access pattern is exactly one <code>GetItem</code> by short code.</p>
<ul>
<li><b>Write path</b>: API Gateway to Lambda. Generate the code — base62 of a counter is guessable, so for public links use random 7-character codes with a conditional write on <code>attribute_not_exists</code> to handle collisions by retry.</li>
<li><b>Read path</b>: CloudFront in front, because a redirect is perfectly cacheable and the hot tail of links is extremely skewed. Most reads should never reach your compute. Behind it, Lambda plus DynamoDB, optionally with DAX.</li>
<li><b>Analytics</b>: do not write a counter per click — that is a hot partition on popular links. Emit to Kinesis Firehose, land in S3, aggregate with Athena or a scheduled job.</li>
</ul>
<p><b>Failure and scale.</b> The first thing that breaks is the popular-link hot partition, which caching solves before it starts. The second is the collision retry loop if the code space is too small for the volume — size it explicitly.</p>
<p><b>What they probe.</b> How you generate codes without a coordination bottleneck, and whether you noticed that click counting is the actual scale problem.</p>

<h2>2. Clickstream analytics, 50,000 events per second</h2>
<p><b>Clarify.</b> Real-time dashboards or next-day reporting? Who consumes it — one team or five? Is replay required after a bug? These decide stream versus queue.</p>
<ul>
<li><b>Ingest</b>: API Gateway or an ALB in front of a collector, writing to <b>Kinesis Data Streams</b>. Partition key on session or user ID for per-user ordering, checked for skew.</li>
<li><b>Hot path</b>: a consumer computing rolling aggregates into DynamoDB or ElastiCache for a live dashboard.</li>
<li><b>Cold path</b>: <b>Firehose</b> from the same stream to S3 in Parquet, partitioned by date and hour, buffered to produce files in the hundreds of megabytes.</li>
<li><b>Query</b>: Glue Catalog plus Athena for ad-hoc, a nightly EMR or Glue job for heavy aggregation, Redshift only if BI usage is constant.</li>
</ul>
<p><b>The decisions to defend.</b> Kinesis over SQS because multiple consumers and replay. Parquet over JSON because Athena bills bytes scanned. Two paths rather than one because the latency requirements genuinely differ and forcing them together compromises both.</p>
<p><b>Failure.</b> Alarm on iterator age — that is the metric that tells you consumers are falling behind. A shard hot from a skewed key throttles while the stream looks healthy overall.</p>

<h2>3. Video upload and transcode</h2>
<ul>
<li><b>Upload</b>: presigned multipart URLs straight to S3. Never proxy gigabytes through your API.</li>
<li><b>Trigger</b>: S3 event to EventBridge or SQS. A queue rather than direct Lambda invocation, because transcoding is long and needs retry with a DLQ.</li>
<li><b>Transcode</b>: MediaConvert if you want managed, or AWS Batch on Spot with FFmpeg if cost matters and you can tolerate retries. Not Lambda — the 15-minute ceiling.</li>
<li><b>Deliver</b>: outputs to S3, served by CloudFront with signed URLs for private content.</li>
<li><b>State</b>: DynamoDB tracking job status per video, updated by the worker, polled or pushed to the client.</li>
</ul>
<p><b>What they probe.</b> Whether you keep large payloads out of the application tier, whether you noticed Lambda cannot do this, and whether the job is idempotent so a Spot interruption is safe. Write to a temp prefix and move on success.</p>

<h2>4. Multi-region disaster recovery</h2>
<p><b>Clarify first, always.</b> Ask for the <b>RTO and RPO as numbers</b>. Every subsequent decision follows from them, and the cost differs by an order of magnitude across the options. An interviewer who says "as low as possible" is testing whether you will push for a real answer.</p>
<table class="plan"><tr><th>Strategy</th><th>RTO</th><th>Standing cost</th><th>What it is</th></tr>
<tr><td>Backup and restore</td><td>Hours</td><td>Lowest</td><td>Snapshots copied cross-region</td></tr>
<tr><td>Pilot light</td><td>Tens of minutes</td><td>Low</td><td>Data replicating, compute off</td></tr>
<tr><td>Warm standby</td><td>Minutes</td><td>Medium</td><td>Scaled-down live stack</td></tr>
<tr><td>Active-active</td><td>Near zero</td><td>Highest</td><td>Both regions serving</td></tr></table>
<p><b>Data is the hard part.</b> Aurora Global Database gives roughly a second of RPO with under a minute of promotion. DynamoDB global tables are active-active with last-writer-wins, which is a correctness question, not a configuration one. S3 cross-region replication is asynchronous and does not backfill.</p>
<p><b>The point to make unprompted.</b> An untested DR plan does not work. Game days, and the failures you find are always in DNS TTLs, missing IAM roles in the second region, and configuration that only existed in the primary.</p>

<h2>5. Notifications to ten million users</h2>
<ul>
<li><b>Fan-out</b>: EventBridge or SNS at the top; per-channel SQS queues for email, push and SMS so a failing SMS provider cannot block push.</li>
<li><b>Preferences</b>: DynamoDB keyed by user, checked by the worker. Do not fan out to users who have opted out — filter early to save the send cost.</li>
<li><b>Rate limiting</b>: workers with capped concurrency matched to each provider's limit. The queue absorbs the difference; that is its job.</li>
<li><b>Idempotency</b>: a notification ID with a conditional write, because sending twice is a user-visible defect and at-least-once delivery guarantees it will be attempted.</li>
<li><b>Batching</b>: for a broadcast to ten million, do not enqueue ten million messages from one process. Chunk the user list in S3 and use a Step Functions distributed map or Batch array job to fan out.</li>
</ul>
<p><b>What they probe.</b> The thundering herd on the downstream provider, and whether you thought about the difference between a broadcast and a per-user event.</p>

<h2>6. ML inference platform</h2>
<ul>
<li><b>Training</b>: SageMaker training jobs on Spot with checkpointing; data in S3, artefacts versioned in the model registry.</li>
<li><b>Serving</b>: real-time endpoints with autoscaling for interactive prediction; asynchronous inference for large payloads; batch transform for anything consumed by a nightly job. Choosing wrong here is the expensive mistake.</li>
<li><b>Features</b>: precomputed features in DynamoDB or ElastiCache for low-latency lookup at request time — computing features synchronously is usually the real latency problem, not the model.</li>
<li><b>Rollout</b>: shadow traffic first, then a weighted split across endpoint variants, with the ability to shift back instantly.</li>
<li><b>Monitoring</b>: latency and errors, plus input distribution drift — a model degrades while every infrastructure metric stays green.</li>
</ul>
<p><b>Cost lever.</b> Idle GPU endpoints. Ask whether the traffic justifies always-on, and if it does not, serverless or asynchronous inference changes the bill by an order of magnitude.</p>
`},

{id:"plan", title:"A four-week plan", nav:"Study plan", html:`
<p class="lede">Assumes you already build systems and need AWS-shaped recall, not a first course. Roughly an hour a day.</p>
<table class="plan">
<tr><th>Week</th><th>Focus</th><th>Done when</th></tr>
<tr><td>1</td><td><a href="#/svc/iam">IAM</a>, <a href="#/svc/vpc">VPC</a>, <a href="#/svc/s3">S3</a></td><td>You can recite policy evaluation order, explain security group versus NACL in four words, and design an S3 key layout for a lake without pausing.</td></tr>
<tr><td>2</td><td><a href="#/svc/dynamodb">DynamoDB</a>, <a href="#/svc/rds">RDS/Aurora</a>, <a href="#/svc/elasticache">ElastiCache</a></td><td>You can model a table from three access patterns on a whiteboard, and explain a cache stampede and its three fixes.</td></tr>
<tr><td>3</td><td><a href="#/svc/sqs">SQS</a>, <a href="#/svc/kinesis">Kinesis</a>, <a href="#/svc/lambda">Lambda</a>, <a href="#/svc/ecs">ECS</a>/<a href="#/svc/eks">EKS</a></td><td>You can answer the duplicate-processing question end to end, and defend a compute choice with a cost crossover argument.</td></tr>
<tr><td>4</td><td><a href="#/guide/designs">Designs</a>, <a href="#/svc/emr">EMR</a>, cost, mock rounds</td><td>You can walk two full designs out loud in 30 minutes each, unprompted on failure modes and bill.</td></tr>
</table>
<h2>How to practise</h2>
<div class="stack">
<div><b>Answer out loud, timed.</b><p>Reading an answer and saying it are different skills, and the gap only shows under pressure. Two minutes for a comparison, twenty-five for a design.</p></div>
<div><b>Use the Cards mode for recall, not for reading.</b><p>Try to answer before flipping. Rating a card honestly is what makes the deck useful — the ones you mark shaky come back.</p></div>
<div><b>Write the failure modes from memory.</b><p>For each service, list three ways it breaks in production without looking. The gaps are your revision list, and this is the fastest way to find them.</p></div>
<div><b>Do the arithmetic.</b><p>Practise converting a traffic number into concurrency, capacity units and shards until it is automatic. It is the single most repeatable way to sound like you have operated at scale.</p></div>
</div>
<h2>The day before</h2>
<p>Do not learn anything new. Re-read <a href="#/guide/numbers">Numbers to know</a>, the six <a href="#/duels">decision tables</a>, and the failure list for the five services most relevant to the role. Then stop.</p>
`}
